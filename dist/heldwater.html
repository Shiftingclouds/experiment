*chapter 5 The Question
The winter term comes in grey and stays grey.

The hum is B-flat again, near enough. The Sluice Gallery has been shored with timber and iron, and the crack in its wall is chalked and numbered and watched day and night by Sluice Watch in shifts. The frays keep coming. Dr. Marchbank has stopped pretending they're mineral and started measuring them with calipers. And the College goes on: lectures, patrols, Stay stew, Sunday letters home. Nobody talks about the Wet Night. Everybody talks about the Question, which is in five weeks, before the Board and the Council, in the Great Hall.

On the second Sunday of term, Sal comes to find you in the Sump.

"Hester wants to see you," they say. "The one from the lift. She asked for you by name." A pause. "Well. By description. She said, [i]the one that did something in the lift that I felt in my back teeth.[/i]" Another pause. "I told her that could be several people. She said, [i]Then bring me the one you like best.[/i]"

*if (rel_sal >= 45)
  They hold your eyes a moment longer than they need to.

The way to the Keystone Chamber is the Crown Stair: a spiral so narrow your shoulders brush both walls, climbing up through the middle of the dam from the Third Gallery. There's no lamp on it. Sal doesn't need one. The hum gets louder with every turn until it isn't a sound anymore but a pressure, like being underwater, and then the stair ends at a small round iron door with no handle.

Sal knocks: three, then two.

"Come in, then," says a voice from inside, the voice from the walls, the voice that said [i]Heard.[/i] "Don't let the draught in. Sal, love, did you bring the biscuits?"
*page_break The Keystone Chamber

It's like being inside a bell.

The room is round and not very large, and the walls are iron: great iron ribs rising from the floor and curving in overhead, close together, black and ancient, humming, all running inward to meet at the center of the ceiling like the spokes of an umbrella seen from beneath. It's warm. It smells of paraffin, and old books, and oranges.

In the middle of the room, bolted to the floor, is an armchair.

Not an iron throne. An armchair, overstuffed, faded red velvet, with the stuffing coming out of one arm and a crocheted blanket over the back. In front of it, at the height of a seated person's hands, two brass rails rise out of the floor, worn gold and smooth as glass. And in the chair sits a small, broad, white-haired woman in a cardigan, with her hands resting on the rails and her face turned toward the door.
*set met_hester true
*set rel_hester +20

Her eyes are pale and clouded, like milk in water. She's smiling.

"There you are," says Hester Quaile. "Come where I can hear you. Sal, put the kettle on, there's a love."

There's a gas ring, and a kettle, and a shelf of books with raised dots instead of letters. There's a wireless set, and a birdcage with a yellow canary in it, and a spittoon, which she informs you she uses. On the walls between the iron ribs, in frames, are dozens of photographs she can't see: a young woman in a College gown, dockworkers on a quay, a wedding, a line of scholars on the crest squinting into the sun.

"The canary's a joke," she says, following your silence. "Some Warden's idea of company. It's the only other thing in here that can't leave, so we get on." She pats the arm of the chair. "Sit. There's a stool. Sal, is it pretty? The one from the lift?"

"I don't think that's a fair question," says Sal, from the kettle.

"I didn't ask if it was fair, I asked if it was true." Hester cackles, a big wheezing laugh like a bellows. "Go on, duck. Tell me your name, so I've something to call you."

*if (vow_name)
  You open your mouth, and the Kept Name shuts it.

  Hester tilts her head, listening to the silence. Then she laughs again, delighted. "Kept Name, is it? Oh, I felt that one go down the Throat. Very good. Very mysterious." She settles back. "I'll call you duck, then. Everybody's duck in the end."
*else
  You tell her. She repeats it, slowly, as if tasting it. "{name}," she says. "Good. That'll do nicely."

Her hands stay on the rails the whole time. Once, reaching for the biscuit Sal gives her, she lifts one hand away, and you feel it: a lurch in the floor, a sag in the hum, like a stair that isn't there. She puts the hand back. The hum steadies.

"Forty-one years," she says, crunching. "You'd think I'd have learned to eat one-handed." She turns her face toward you. "Go on, then. You've questions. Everybody has questions. Nobody ever asks them, they just sit there looking sorry for me. Ask me."

    She's quiet a moment.

The week before the Question, Councillor Honoria Varnish comes to the College.

The Council's Stay Committee sits with the Board of the College once a term, and this term it sits early, in the Warden's parlor, with the door shut. You see Honoria cross the crest in a long grey coat, with two Councillors a step behind her like pages, and the whole College goes quiet as she passes, the way birds go quiet under a hawk.

She sends for Tolly afterwards. He's gone for twenty minutes.

When he comes back to the Sump he walks straight past everyone to the dead piano and sits down at it and plays the same four notes, over and over, until the mill-town pair get up and leave the room. Then he stops, and turns round on the stool, and looks at you.

"She's told me two things," he says. His voice is perfectly light. "The first is that I'm to lose the Crown. Gracefully, she said. [i]Lose gracefully, darling.[/i] Which is a relief, honestly; I was going to anyway." He laughs. "The second is that I'm to tell her, every Sunday, in my letter, everything that you do."

He looks at his hands on his knees.

"She said your name. She knows your name. She said, [i]Your friend {name}. Tell me what they do.[/i] Every Sunday." His voice cracks, finally. "And I will. I'll have to. I'll sit down on Sunday and my hand will write it all down, everything I've seen, everything you've said in front of me, and I'll post it, and I won't be able to stop."

He takes a long breath.

"So I'm asking you, as your friend: please be extremely boring this week. Do boring things. Eat turnips. Log weep-holes. I can only tell her what I see."

*chapter 6 The Deep
The thaw comes early and badly.

Snow melts on the fells all at once, and the becks come down white, and the Heldwater rises a foot in a week. The Stay weeps day and night. Twice in March the hum dips to A in the small hours and stays there for a minute, two minutes, while every tuning fork in the Footings shivers on its shelf, and then (slowly, with an effort you can feel in your teeth) Hester hauls it back up.

The frays are everywhere now. Footing Watch chalks forty in a single night.
*if (revealed_public)
  The city is watching, now. There's a crowd at the Weir Lift most mornings, and a [i]Courier[/i] reporter who sleeps in the lift shed, and a Council "commission of inquiry" that has met twice and adjourned twice.
  *if (honoria_exposed)
    Honoria Varnish has not been seen on the crest since the Question. They say she's on Crowhill, and that she has not resigned, and that she has lawyers.

In the second week of March, Dr. Marchbank calls Footing Watch into the Water and Stone room, shuts the door, and pins a map of Scarrow to the wall.

*if (reported_frays)
  "You gave me the first one," she says, looking straight at you. "In writing. I've been measuring them ever since." She taps the map. "Every fray runs the same way. Out of the Stay, through the culverts, down the river. Toward the city." She takes off her glasses. "Somebody is doing this. Somebody downstream, leaning up the water into the wall, a thread at a time. Has been for years."
*else
  "Every fray in the Stay runs the same way," she says, and taps the map. "Out of the wall, through the culverts, down the river. Toward the city." She takes off her glasses. "Somebody is doing this. Somebody downstream, leaning up the water into the wall, a thread at a time. Has been for years."

"Tonight," says Hob Gorringe, very quietly, "Footing Watch is going to find out who."
*page_break The tracing

You go out through the sally port at the toe of the Stay at midnight: a low iron door at the very bottom of the dam, where Footing Watch keeps its tools, opening onto the river bank under the wall. The night is black and loud with water. Scarrow's lights are straight ahead, down the valley.

The thread is easy to find, once you know how to look. It lies in the water of the main culvert where it comes out of the Stay, a fine white line under the surface, pulsing, running away downstream in the dark.

You follow it.

It takes two hours. Along the culvert to the river. Along the river bank, under the mill wheels, past the dye-works with the blue water steaming. Into the Nethers, where the thread leaves the river and runs up a drain, and then another, under the cobbles, glinting through the gratings: Tanner's Row, Gas Street, into the Rows. Mill Lane.

Tamsin has gone quiet somewhere around the dye-works.

By the time the thread turns into Mill Lane she's stopped talking altogether, and her face in the lantern-light has gone the color of candle wax. At the corner she stops dead. Then, without a word, she starts to run.

You run after her. Hob shouts. The others fall behind.

She stops outside Number Nine: {@leave_choice = "rows"|the house where you sat eating soup at three in the morning at Midwinter.|her Nan's house, named for a house forty fathoms down.} The kitchen window is lit. It's twenty past three.

Through the glass you can see a small figure in a chair by the range, knitting very fast, without looking at her hands. The wool is white. It comes off a ball in a basket by her feet, and the ball is fed by a thread that runs across the kitchen floor, and under the back door, and out into the yard, and down the drain.

Nan Win Mottram is singing under her breath. You can't hear the words, but you know the tune. It's the note. It's Hester's note, the one that holds the Stay, sung very slightly flat, like a key turned the wrong way in a lock.
*set know_nan true
*achieve sleepless
*journal The saboteur is Nan Win Mottram. Every night for thirty-one years she has knitted and unpicked a white jumper, and her lean runs up the water into the Stay, unpicking it a thread at a time.
*page_break Number Nine, Mill Lane

Tamsin opens the kitchen door.

Nan's needles don't stop. She looks up at her granddaughter, and at you behind her, and her bright black eyes take in the lantern and the mud on your boots and the look on Tamsin's face, and something in her own face goes very tired and very old.

"Took you long enough," she says. "Shut the door, love. You're letting the cold in."

"Nan," says Tamsin. "Nan, what are you [i]doing?[/i]"

And Win Mottram tells you.

"Thirty-one years ago," she says, knitting, "the Council signed their Settlement. Said Hebble'd been paid. Said we'd gone of our own free will. Wrote it down, and signed it, and put it in the law." The needles click. "That was the week my Tam died. Your granddad, love. Holding lung. Thirty years in them seats and his chest went like wet paper. I buried him on the Tuesday and on the Friday I read the Settlement in the [i]Courier.[/i]"

She finishes a row, and turns the work.

"So I went down to the old Wordhouse that night and I swore it. [i]I will not sleep while the Stay stands.[/i] And it took. And I've not slept since." She smiles a little, at nothing. "You'd think you'd go mad. You don't. You just get very, very patient."

"And every night you pull a thread," you say.

"Every night I knit a row, and every dawn I unpick it, and every thread I unpick comes out of their wall." She holds up the white wool, and it glitters like salt. "Slow. So slow. I wanted it slow. I wanted it to take thirty years, so they'd have thirty years to see it coming, and empty the valley, and drain it proper, and build it right. I wanted them to [i]have[/i] to drain it." Her voice doesn't rise. "I wanted them to have to look at Hebble."

"It's going to break, Nan," says Tamsin. Her voice is shaking. "It's going to break and the water will come down on the Rows first. On [i]us.[/i]"

"The Rows'll be up Tanner's Hill in forty minutes," says Nan. "Why d'you think I made Ezra Dunnock drill them every year since you were a baby?" She looks at her granddaughter, and her eyes are wet. "I've thought of everything, my girl. Everything but my hands. My hands aren't what they were. I pull harder than I mean to, now. It's gone faster since the autumn. I've been frightened since the autumn." She looks at the wool. "And her."

"Hester," you say.

"Hester Quaile." The needles stop, for the first time. "She let me go. Nineteen years old, and she swore herself into that wall so two hundred of us could walk out into the light. I owe her everything I've got." Win Mottram looks at you, and her face is naked. "I know what every thread costs her. I'm sorry every night. And every night I pull another."

It's your choice. Tamsin can't make it. She's looking at you, from the floor, and you realise she's waiting for you to.

Win Mottram looks at you, and her face does something slow and astonished and fierce, like a fire catching.

"Well," she says. "Well, well. There's a thing."

She tells you everything. How the Stay was built, from the inside, by someone who sat in it for thirty years and listened to every stone: where the iron runs, where the old seals are, how the Old Sluices on the east side were bricked up and sealed with a Council lean seventy years ago and how that lean has been fraying for a decade. How a sluice gate, opened a quarter-turn an hour, would let the lake down a foot an hour and put the Nethers knee-deep by dawn. How many minutes the Rows need. How many minutes the rest of the Nethers would need, if anyone told them.

Tamsin, on the floor, is staring at you both as if you've grown horns.

"You're both mad," she says. And then, after a long silence, very low: "Tell me how we'd warn the Nethers."

*label tolly_snap
He decides on the first warm night of April.

His mother's Sunday letter has a line in it: [i]Come home at Lady Day, darling; the Hesketh girl's mother is giving a dinner.[/i] It's a small command. It's the smallest command she's given all year.

"That one," Tolly says. He's sitting on the crest with the letter in his lap and his face grey in the lamplight. "It's a little one. If I'm going to break it, better a little one." He laughs shakily. "Master Fell broke his at twenty-two and it nearly killed him. I've had mine since I was one. It's in my bones." He looks at you. "Will you hold on to me?"

He stands up on the crest in the wind. He takes a breath. You take his hands.

"Mother," says Ptolemy Varnish, clearly, to the lake. "No."

The snap is like lightning striking the crest.

It goes through him and through you, where your hands are joined: a white shock, a tearing, a sound like a hawser parting under load. His whole body arches. His eyes roll up. He'd go over the parapet if you weren't holding him.

*page_break The Deep

The Deep is dived on the first calm morning of May.

Three barges are moored in a line on the Heldwater, a mile up the lake from the Stay, over the place where the chart says [i]Hebble (submerged).[/i] Each barge carries an iron diving bell on a chain, big as a garden shed, open at the bottom, full of trapped air. The whole College is out on the water in rowing boats, and half of Scarrow is lined up along the crest with telescopes.

The rules are old and simple. Entrants and seconds go down in the bells to the bottom, twenty fathoms, where the bells sit on the cobbles of the drowned village. From there they swim (breath held, or leaning) thirty yards to the Wordhouse of Hebble. On the stone table in the Wordhouse lies the tongue of the Hebble bell: a bronze clapper as long as your arm, carried down every spring by the previous year's Crowned and left there. The first to bring it back to their bell wins the Deep.

"The Deep counts for more than the other two together," the Warden says, on the lead barge. "It always has." She looks along the line of entrants.

*page_break Hebble

It's green.

Everything is green: the light, the water, the silt that hangs in it like smoke. The lamps make soft gold rooms in the green, and in the gold rooms, as you swim, things appear. A lane between stone houses. A cart, on its side, with its shafts still up. Doorsteps. Window boxes. A garden wall, with a gate, shut. A pram.

The houses are all still standing. Their roofs are on. Their doors are closed. It looks exactly like a village where everyone has gone to bed.

It's the loneliest thing you have ever seen.

*label mill_lane
Number Nine, Mill Lane, is a stone cottage with a green door and a brass knocker gone black. The window boxes still have soil in them. Tamsin hangs in the water in front of the door with the key in her hand, and for a moment she doesn't move at all.

Then she puts the key in the lock, and turns it, and it turns.

The door swings in on a slow puff of silt. Inside is a kitchen. There's a table, set for tea: three cups, a teapot, a loaf on a board, all furred grey and soft with seventy years of silt. There's a range. There's a chair by the range, just like the one in the Rows. There's a mantelpiece with a clock on it, stopped at twenty to four.

On the mantelpiece, beside the clock, there's a tin box.
*set visited_house true
*achieve the_key

Tamsin opens it. Inside, wrapped in oilskin, tied with string, dry as the day it was sealed, is a letter. On the outside, in a careful, laboured hand: [i]For Win.[/i]

You don't read it there. You can't; your lungs are screaming, and hers must be too. Tamsin puts it inside her diving shirt, against her skin, and takes one last look round the kitchen: the cups, the chair, the stopped clock.

Then she turns and swims back up Mill Lane, fast, and doesn't look back, and you follow her.

Later, much later, on the barge, wrapped in blankets and shaking, you read it together.

[i]Win. If you read this, the water came and I stayed. I would not let them make me leave, and I would not swear their oath, and that was my choice, and nobody else's. Don't you dare stay angry for me, love. Anger's a long cold thing to carry, and you've only got the two hands. Live. Marry that Mottram boy. Sleep of a night. Your loving Mam.[/i]

Tamsin reads it three times. Then she folds it up very small and puts it inside her shirt again, and puts her face in her blanket, and doesn't say anything for a long time.

"Sleep of a night," she says eventually, muffled. "Seventy-one years. She never got it."

*comment ==================================================================

    *else
      Hob listens, and frowns, and shakes his head slowly. "I'd want to see the numbers," he says. "I'd want Dr. Marchbank to see the numbers. I'm not putting first-years in a live lattice on a hunch." He means it kindly. It's still a no.

      *if (crowned = "rilla")

      *else

      Every hand in the room goes up.

      *set ally_tamsin true
      She hears you out on the crest, with her arms folded, looking at the water.

      "If it works," she says slowly, "I don't have to go into the wall." She doesn't look at you. "And if it doesn't, I do." A long pause. "Aye. I'll sit in their seat first. Nan's seat. If there's any chance." She finally turns her head. "Find me hands, then."

  *hide_reuse #Sal.

    *if ((rel_sal >= 55) or (romance = "sal"))
      *set ally_sal true

      "What is kept, keeps," they say at last. "I always thought that meant one person keeping. Keeping faith. Holding on." They look at their hands. "But a hive keeps. Every bee holds a little. None of them holds it all." They look up at you. "I think Hester would like that better. I think I would." A breath. "Yes. I'll sit in the seats."
    *else

    *else

    *else

*comment ------------------------------------------------------------------
*label marchbank
Dr. Marchbank is in the Water and Stone room at midnight, surrounded by drawings of the Old Sluices.
*if (honoria_exposed)
  "They can't hold me to silence about a report the whole city's read," she says, before you've said a word. "The vow was [i]I will not publish.[/i] It's published." She sounds almost cheerful.
*else
  "I can't publish it," she says, before you've said a word. "I swore. But I never swore not to [i]teach.[/i]"
She shows you. Four gates, on the east side, under the Sluice Gallery, bricked up and sealed with a Council lean seventy years old and fraying now. Behind the bricks, iron wheels as tall as a man. A quarter-turn an hour on each gate, she says, and the lake comes down a foot an hour. The Nethers floods to the knee by dawn. The Stay's load halves by morning.

"Somebody would have to hold the wall while it drained," she says. "It'll crack. It'll want holding for five or six hours. Longer if it's gone bad." She looks at you. "And the Nethers would have to be empty first. Everybody out. I won't do it with people in their beds."

Then she takes a key out of her waistcoat pocket: iron, as long as your hand, black with age. She puts it on the drawing between you.

"The master key to the sluice chambers," she says. "Thwaite's own. It's been in my desk for eleven years." She doesn't pick it up again. "I'm going to step out for eleven minutes. There's nothing on this table you should take."

She steps out. The key is on the table.
*set eng true
*set marchbank_key true
*journal Dr. Marchbank has shown you the Old Sluices: four gates, a quarter-turn an hour, the lake down a foot an hour. Someone must hold the wall for five or six hours while it drains, and the Nethers must be empty first. You have Thwaite's key.
*return

*comment ------------------------------------------------------------------
*label rain
The first real rain of summer comes on a Thursday night, hard and warm, off the fells.

You go up onto the crest in it with a stone jar, and stand in the dark until the jar is full and you're soaked to the skin, and then you carry it down the Crown Stair in both hands, careful as if it's full of eggs.
*if (vow_door)
  (She asked. You couldn't have refused her. You'd never have wanted to.)
Hester hears you coming. "What have you got?" she says. "You're dripping. You're [i]dripping.[/i] What've you—"

"Tip your head back," you say.

She does. And you pour the rain over her face, slowly, the whole jar, warm summer rain off the fells, and it runs through her white hair and down her cheeks and into the collar of her cardigan, and she opens her mouth, like a girl on a dock, and catches it.

She doesn't say anything for a long time. Her hands stay on the rails. Her face is wet, and it isn't all rain.

"Pier Street," she says finally. "The smell of it. Oh, that's Pier Street." She laughs, a wet, cracked, marvelous sound. "Oh, duck. Oh, you daft, lovely—" She stops. "Forty-one years."
*set rain_given true
*set rel_hester +20
*achieve rain
*if (not hester_plan)
  When she can talk again, she says: "I'll give you something back. You'll need it." She grips your wrist. "On the night, when I let go (and I will, I've said Midsummer), I'll not just let go. I'll hand it over to whoever's there to take it. Bring me hands, or bring me the Heir, but bring me somebody, and I'll give it to them gentle. I'll not drop it on you."
  *set hester_plan true
*else
  When she can talk again, she says: "Bring me hands, on the night. I'll hand it over gentle. I promised." She squeezes your wrist. "Now I've got two reasons to keep that promise."
*return

*comment ------------------------------------------------------------------
*label fell_visit
Master Fell is in his attic room, and he's different.

It takes you a moment to see how. His cuffs aren't pinned. His chalk isn't sharpened. There's a book face-down open on his desk (Fell, who shelves by height) and he's sitting on the windowsill with his feet up, looking at the lake.

"I went," he says, before you ask. "On the Sunday. Up the Crown Stair, all the way. I knocked." He laughs, not quite steadily. "She said, [i]Ambrose, you took your bloody time.[/i] And then she made me put the kettle on."

He looks at you.

"She told me the same thing she told you. Nothing to forgive." He shakes his head. "She says the thing I've got to do isn't to be forgiven. It's to stop running." A long breath. "I've been thinking about what that would mean. On the night."
*if (rel_fell >= 50)
  *set fell_ready true
  *set rel_fell +10
  He stands up, and he's steadier than you've ever seen him.

  "If it comes to it," says Ambrose Fell, "and there's nobody else, then this time I'll be there. I'll take the chair. I'm forty-four, my lever's shorter than it was, but it's long enough to be worth something." He smiles, a real one. "Twenty-two years late. But I'll be there."
  *journal Master Fell says that if it comes to it, this time he will take the chair.
*else
  *set rel_fell +5
  He doesn't finish the thought. You can see him not finishing it. "I'm working on it," he says. "Give me time."
*return

*comment ------------------------------------------------------------------
*label warden_visit
The Warden is at her window, as she always seems to be now.

"Scholar," she says. "Sit."

You talk about Midsummer. You talk about the Heir, and the chair, and what happens on the night. She answers every question you ask exactly, and when she can't answer, she's silent, and you've learned how to hear her silences.
*if ((rel_warden >= 60) or (revealed_public and (rel_warden >= 45)))
  *set warden_ready true
  *set rel_warden +5
  At the end she's quiet for a long time.

  "I am sixty-three," she says. "The lever is short. If I swore the Great Vow, I'd hold the Stay for five years. Perhaps six." She looks at you. "Long enough for a city to build a proper dam, if it were shamed into it." Her voice is perfectly level. "If there is no other way on the night, I will take the chair. I want you to know that. I have asked others to do it for nineteen years. I would like, once, to do the thing I have asked."
  *journal The Warden: "If there is no other way on the night, I will take the chair. Five years, perhaps six."
*else
  *set rel_warden +5
  At the end she stands up, which means you're dismissed. "Thank you for asking," she says. "Exactly. As always."
*return

*set duty %+10
Honoria Varnish's house on Crowhill is quiet these days. She receives you in the library.
*if (honoria_exposed)
  She has lost the Committee, and her name is in the papers, and she looks older. But the Council still owns the Writ of Restraint, and in an emergency somebody will have to hold it, and she has made sure that somebody is her.
"On Crown Night," says Honoria, "there will be people on the crest who think they know better than the law. People who will try to stop the Heir from doing what the Heir must do. Some of them, I'm afraid, are your friends." She looks at you steadily. "I would like there to be someone on the crest that night who understands that order is a kindness. That a city is a promise, and that somebody has to keep it."

<script>
HW.scene("ch7", String.raw`
*chapter 7 Crown Night
*temp cname ""
*if (crowned = "pc")
  *set cname name
*elseif (crowned = "tamsin")
  *set cname "Tamsin"
*elseif (crowned = "sal")
  *set cname "Sal"
*elseif (crowned = "tolly")
  *set cname "Tolly"
*else
  *set cname "Rilla"
*temp nan_here false
*if (nan_state != "exposed")
  *set nan_here true
*set fell_here false
*if ((fell_ready) or (ally_fell))
  *set fell_here true
*temp nan_active false
*if ((nan_state = "protected") or (nan_state = "joined"))
  *set nan_active true
*temp free_pc false
*if ((vows = 0) or ((vows = 1) and (vow_weep) and (not registered_weep)))
  *set free_pc true
*temp surge_used false
*temp force_weep false

Midsummer comes in hot and airless, with thunder sitting on the fells all afternoon like a dog on a doorstep.

By evening the whole of Scarrow has come up to the Stay. They fill the crest road from end to end: mill-hands and Crowhill wives, Rows folk in their Sunday coats, children on shoulders, the [i]Courier[/i]'s photographer on a stepladder, constables in capes. The braziers are lit all along the parapet. The lake is flat as oil and the color of a bruise, and above it, over the fells, the storm is stacking itself up in towers, purple and gold, lit from inside by lightning that doesn't make a sound.
*if (revealed_public)
  They know. That's the difference from every other Crown Night in forty-one years: this crowd knows what it has come to watch. There's no bunting. People are very quiet.
*else
  There's bunting. There's a brass band. Most of the crowd thinks it has come to a coronation.
*if (nan_here)
  At the front, beside Tamsin's mother with her blue hands, sits a very small old woman in a wheeled chair, wrapped in a shawl, with her bright black eyes fixed on the wall. Nan Win has come to see the Stay.
*if (fell_here)
  Master Fell stands at the edge of the masters' enclosure in his best gown, with his hands clasped behind his back to stop them shaking. He sees you looking, and nods, once.
*else
  Master Fell is nowhere to be seen. Nobody is surprised, except you.
*if (honoria_exposed)
  The Council's party stands apart on a railed platform by the lift shed: a dozen Councillors in sashes, and, among them, grey-faced and upright as a tombstone, Honoria Varnish. She has lost the Committee. She has not lost her seat, or her nerve.
*else
  The Council's party stands on a railed platform by the lift shed: a dozen Councillors in sashes, and at their center, in dark green velvet with a single diamond at her throat, Honoria Varnish. Beside her, a constable holds a small iron-bound box. You know what's in it. Everyone who has read the Oathing Act knows what's in it: the Writ of Restraint.

The Warden stands on the dais at the center of the crest, in her black gown, with the whole city in front of her and the whole lake behind. She doesn't raise her voice. She doesn't need to.

"The Crown," says Agnes Brathwaite, "has been contested, and decided. The Heir to the Stay is {cname}."
*if (crowned = "pc")
  *goto crowning_you
*goto crowning_other

*label crowning_you
Your name goes out over the crest and the crowd, and comes back off the water.

You climb the steps to the dais. Your legs are somebody else's. The Warden sets a circlet of crest heather on your head, the only crown the Crown has ever been, and it smells of honey and smoke, and her hands are cold and quite steady.

"You stand ready to serve the Stay," she says. And then, so quietly only you can hear it: "I am sorry."
*if (romance != "")
  In the crowd, you find the one face you're looking for. They're not cheering. They're looking at you as if they're trying to memorize you.
*goto hester_stops

*label crowning_other
*if (crowned = "tamsin")
  Tamsin climbs the steps in her laundry-worn coat with her jaw set like a trap and her Nan's key on its string outside her collar, where everyone can see it. When the Warden sets the heather on her head she doesn't bow. She turns and looks out over the crowd, over the Rows folk at the front, over her Nan in her wheeled chair, and lifts her chin.
*elseif (crowned = "sal")
  Sal climbs the steps unhurried, in a clean smock, with a smudge of beeswax on one cheek. When the Warden sets the heather on their head, Sal takes her hand and holds it for a moment, and says something, and the Warden's face does something you've never seen it do.
*elseif (crowned = "tolly")
  Tolly climbs the steps in white tie, because, he told you this morning, if he's going to be bound for life he intends to be the best-dressed man in the wall. When the Warden sets the heather on his head he looks out over the crowd for his mother, and finds her, and holds her eyes, and smiles.
*else
  Rilla Hesketh climbs the steps in blue silk.
  *if (revealed_public)
    She knows. She's known since the Question. She walks up those steps like someone walking to a scaffold she has decided to build herself, and when the Warden sets the heather on her head she doesn't flinch.
  *else
    She's smiling, golden, waving to Crest Watch. She doesn't know. You watch the Warden set the heather on her head and say [i]You stand ready to serve the Stay,[/i] and you watch Rilla say "I do," laughing, and you feel sick.

"You stand ready to serve the Stay," says the Warden, to {cname}.

*label hester_stops
*page_break Midsummer

Then, under everything, you hear her singing.

Everyone does. It comes up through the crest stones, through the cobbles, through the soles of ten thousand feet: Hester's voice, the note that holds the Stay, stronger than you've ever heard it. The crowd goes silent. The band stops mid-bar. The whole city stands on top of the wall and listens to a blind woman sing in the dark heart of it.

It's beautiful. It's the most beautiful thing you've ever heard. It goes on for a long time.

And then it stops.

Not a fade. Not a falter. It stops, clean, in the middle of the note, like a door closing. And in the silence, so faint you'd think you imagined it if you hadn't heard it every night for nine months, carried up through the Throat of the Oathing Hall and out across the crest, comes a dry, tired, satisfied voice:

[i]"I said Midsummer. I keep my word."[/i]

The hum drops.
*set hum "A"

A-flat. G. The crest shivers under your feet like the deck of a ship. Somewhere below, deep in the wall, something breaks with a sound like a cannon, and a crack runs across the cobbles of the crest road, right through the crowd, and people scream. Over the parapet on the downstream side, the face of the Stay bursts into water: jets from every weep-hole at once, white and roaring, hundreds of them, down four hundred feet into the dark.
*set hum "G"

The storm breaks. The rain comes down like a thrown bucket.

On the dais, the Warden has already turned to the Heir. "{cname}," she says. "With me. Now."
*page_break

*comment ==================================================================
*comment THE WRIT (gosub): Honoria seals the room. Returns with writ false if broken.
*label the_writ
*page_break The Writ of Restraint

The door crashes open behind you.

Honoria Varnish stands in it, soaked to the skin, her velvet black with rain and her silver hair plastered to her skull, with two constables at her back. In her hand is an iron seal the size of a fist, heavy and dark, hanging from a chain.

"By the Council's Writ of Restraint," she says, and her voice is quite level, "under the Oathing Act, in a public emergency, every registered Sworn in sight of this seal is bound to stand."

She presses the seal against the door frame.

It's like the air turning to glass. Around you, everyone who has ever sworn a vow at the College (every registered Sworn in Scarrow) goes still. Not frozen, exactly. Held. You can see them trying to move, their faces straining, their eyes wild. The Writ holds them by their words: by every vow written in the Council's registry, beside their names.
*if (tolly_state = "bound")
  Tolly followed you down; he's at the back, white-faced. "Ptolemy," says Honoria, without looking at him. "Don't move." And Tolly, who was never registered, who the Writ can't touch, goes still anyway, because his mother told him to.
*if (free_pc)
  The Writ doesn't hold you.

  You feel it try. It gropes for you the way a hand gropes in a drawer for a key that isn't there, and finds nothing, because there is nothing in the Council's registry with your name on it.
  *if (vows = 0)
    You walked out of the Oathing unsworn. Nothing holds you by your word.
  *else
    You told the Warden, on the first day, [i]Not since I turned eighteen.[/i] Your wild vow was never written down.
*else
  It holds you. You feel it close around the vow you swore in the Oathing Hall like a fist around a coin. Your arms won't move. Your feet won't move.

"The Heir will be bound," says Honoria Varnish. "As the law requires. I am sorry for all of you. I did not make the world."

*choice
  *if (free_pc) #Walk through the Writ as if it isn't there, and take the seal out of her hand.
    *set writ false
    *set bold %+10
    You walk across the room. Honoria watches you come, and for the first time since you've known her, she looks afraid. You take the seal out of her hand. It's heavy and very cold. You drop it into the water on the floor, and the air lets go of everyone at once, like a held breath.

    "Unsworn," says Honoria Varnish, very quietly. "Of course. Of course it would be." She doesn't try to stop you. She sits down on the wet steps with her hands in her lap.
    *return
  *if (fell_here) #Master Fell is unsworn. The Writ can't hold him either.
    *set writ false
    *set rel_fell +10
    Ambrose Fell steps forward out of the held crowd.

    "I'm unsworn, Honoria," he says. His voice is shaking, and he keeps walking anyway. "You can't hold me. Nobody's been able to hold me for twenty-two years. That was always the trouble." He takes the seal out of her hand, gently, the way you'd take a knife from a child, and drops it in the water. The air lets go.

  *if ((ally_tamsin) or (crowned = "tamsin")) #Tamsin. She's hedge-sworn. Never registered. The Writ can't find her.
    *set writ false

    *set rel_tolly +10

*comment ==================================================================
*label chamber
*page_break The Keystone Chamber

You run up the Crown Stair behind the Warden in the dark, with the Heir between you, and the stair is shaking, and water is coming down the steps in a stream.
*if (crowned != "sal")
  Sal is already there when you burst through the iron door. Of course Sal is already there.
*else
  Sal pushes past you through the iron door before you're even at the top, and goes straight to the chair.

The chamber is roaring. The iron ribs in the walls are ringing like struck bells, all of them at once, out of tune, a terrible jangling chord. Water is running down them. The canary is going mad in its cage.

And in the middle of it all, in her red armchair, with her hands in her lap (not on the rails, [i]in her lap,[/i] folded) sits Hester Quaile, with her head tipped back and her clouded eyes closed.

She's alive. Just. You can see her breathing, shallow and slow. Sal is kneeling beside her, holding one of her hands.

"She let go," says Sal. "She said she would. She let go at the end of the note." Their voice is perfectly steady. "It isn't holding. Nothing's holding it. The chair's empty."

The Warden goes to the rails. She doesn't touch them. She turns and looks at the Heir.
*if (fell_here)
  The door bangs open behind you. Master Fell, soaked, gasping, in his best gown, stops dead on the threshold of the room he has spent twenty-two years not entering.
*if ((tolly_state != "bound") and (rel_tolly >= 50) and (crowned != "tolly"))

Hester's head turns, very slowly, toward the sound of your breathing.

"That's you, duck," she whispers. "I'd know you anywhere."

"Somebody," says the Warden, very quietly, "has to take the chair."

The whole room hears her. The ribs ring. The water runs.

  Your eyes are stinging. Your throat has closed. Something that's been dammed up inside you since you were eight years old, beside your father's grave in the wind, is pressing against the wall.
  *choice
    #Let it come. Weep.
      *set force_weep true
      *gosub snap_vow

*if (bound = "pc")
  You walk to the red armchair. Sal helps Hester out of it, as gently as moving a sleeping child, and lays her down on the blanket on the floor, with her head in Sal's lap.

  You sit down in the chair. It's warm.

  You put your hands on the brass rails. They're worn so smooth they feel like water, and they're humming, and the moment you touch them you can feel it: all of it, the whole Stay, every stone, every crack, the whole weight of the Heldwater leaning on you like a cow on a gate. It's unbearable. It's the heaviest thing in the world.

  Fell sits down in the chair. He puts his hands on the rails, and flinches, and doesn't let go.

  "I will not leave the Stay," says Ambrose Fell. And he doesn't.
  *goto_scene endings long_watch

  She sits. She puts her hands on the rails.

  "I will not leave the Stay," says the Warden, in the Plain Word, and her voice doesn't shake at all.
  *goto_scene endings wardens_due
*elseif (bound = "tolly")
  Tolly walks to the chair. He's smiling, badly, with his whole face.

  "Isn't it strange," he says, to you. "It's the first thing that was ever mine. I'd like to keep it." He sits down, and puts his hands on the rails, and gasps at the weight, and holds on.

  "I will not leave the Stay," says Ptolemy Varnish. Nobody told him to.
  *goto_scene endings keystone_tolly
*elseif (bound = "tamsin")

  "I will not leave the Stay," says Tamsin Mottram. And then, under her breath, to the wall, to the water, to the drowned village forty fathoms down: "Not until you've given it back."

  *if (revealed_public)

*comment ==================================================================
*label holding
*page_break The Hebble Gallery

You go down through the Stay against the flood of people coming up.

The stairs are running with water. The galleries are full of shouting and lantern-light and the terrible jangling of the ribs in the walls, out of tune. Twice you have to climb over fallen stone. And all the way down, you're shouting: [i]The old gallery. The Hebble Gallery. Everyone who'll come.[/i]

*else
  The iron door marked H.G. is shut and sealed. You get it open with every scrap of purchase you have, and your shoulder, and the Stay's own shaking, which does half the work for you.

Inside, the Hebble Gallery is singing.

All the iron is awake. The seats, the rails, the ribs running up into the wall, the great black spine at the far end: all of it is ringing, a huge ragged chord, and the white frays crawl over everything like frost. The chord is two hundred and six notes, and every one of them is out of tune.

At dawn the storm blows itself out over the fells, and the Heldwater lies flat and silver under a washed sky, and the Stay hums B-flat, true as a bell.

Two hundred and six seats in the Hebble Gallery are full. More people are coming down the stairs to take turns: scholars, Rows folk, mill-hands, a policeman in his cape, three nuns from the Keeping sisterhood on Old Market, a Councillor's wife from Crowhill still in her pearls. Someone has set up a trestle table by the door with an urn of tea. Hob Gorringe is writing names on a roster in pencil, with shifts. [i]A year and a day. A month. Until the lake's down.[/i] Nobody holds it all. Everybody holds a little. When your shift is over, you go up the stairs into the daylight, and someone else sits down.

  They carry her up to the crest at noon, chair and all, eight scholars on poles, because she asked. Her vow says she cannot leave the Stay. The crest is part of the Stay. It is raining again, a soft summer rain off the fells, and they set her down on the cobbles in the middle of the crest road with the whole lake in front of her, and she tips her head back, and opens her mouth, and catches it.

  "Oh," says Hester Quaile. "Oh, that's Pier Street." And she laughs, and laughs, and the whole crest laughs with her, and nobody minds that they're all getting soaked.
*else
  In the Keystone Chamber, in her red armchair, with her hands in her lap and nothing at all on her shoulders for the first time in forty-one years, Hester Quaile died a little after four in the morning, as the load went out of her into two hundred pairs of hands.

  Sal was with her. They say she was smiling. They say the last thing she said was [i]That's better. Oh, that's much better,[/i] and then, [i]Thank you, ducks,[/i] to nobody in particular, to everybody, to the whole wall.
*gosub epilogue

*page_break Dawn
All night the lake goes out through the Old Sluices, a quarter-turn an hour, a foot an hour, roaring down the valley in four white columns that you can hear from the crest like a train that never ends.

The Nethers floods. It floods to the knee, then to the waist on the lowest streets, and the Cut goes over its banks, and the dye-works turns the whole river blue from the mill-race to the sea.
*if (casualties = "none")
  But the Nethers is empty. Every house. Every bed. Hob's runners, the Rows phone tree, Mam's siren, the [i]Courier[/i]'s map: somewhere up on Tanner's Hill in the rain, forty thousand people are standing in blankets, watching the water come down their own streets. Not one of them is in it.
*elseif (casualties = "few")
  Most of the Nethers got out. Not all. When they count, in the grey days after, it's eleven: the old, the sick, a drunk asleep in a cellar on Gas Street, a family on Dye Row who didn't hear. Eleven names. You'll know every one of them by heart before the summer's out.
*else
  Not enough of the Nethers got out. Nobody woke them in time. When they count, in the grey days after, it's more than a hundred: people who slept through the hum, and through the rain, and woke with the water already on the stairs. You'll know every one of those names by heart. You'll have time to learn them.

And the Stay holds. It cracks from crest to footing with a sound like the sky tearing, and the face of it spits stone and water all night, and it holds, because the people in the Sluice Gallery hold it, hand to stone, until the lake is too low to need them.

At dawn you climb up onto the crest with your hands raw and your legs shaking, and look north.

The Heldwater is forty feet lower than it was at midnight. And a mile up the valley, standing up out of the grey water in the first light like something rising out of sleep, is a squat stone tower. The Wordhouse of Hebble. Its bell-tower. Its roof. And around it, as you watch, as the whole of Scarrow on Tanner's Hill watches, the tops of the houses. Chimney pots. Slates. The line of a lane.

Somebody on the crest starts to cry. Then somebody else.

The Heldwater goes down the valley in a single wave, black and white and roaring, forty feet high.

It doesn't fall all at once. Nothing that big does. The crown of the arch bows outward, and cracks, and the cracks run down the face of the wall like lightning running down a tree, and the lake finds them. And then the middle of the Stay simply goes: two hundred feet of stone and seventy-one years of vows, pushed out into the dark by eleven miles of water that has been waiting all that time to leave.

*elseif (casualties = "dozens")

The Stay takes you.

It's like being poured into a mould. All at once you are enormous: four hundred feet high and a quarter-mile long, with eleven miles of water leaning on your chest and a whole city asleep at your feet. You feel every stone. You feel every crack, every drip, every fray. You feel the scholars running on the stairs like mice in your walls. You feel the wind on the crest, and the rain, and the lake.

It's the heaviest thing in the world. After a while, it's just heavy.

The hum comes back up to B-flat, and holds.
