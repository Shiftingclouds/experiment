/* HELDWATER — stylesheet
 * Palette: limestone & verdigris (light), lake-at-night (dark), plain day (white).
 * Type: IM Fell English (display) · Literata (reading) · Barlow Semi Condensed (labels, gauges).
 */

:root {
  --bg: #e8ebe6;          /* limestone */
  --surface: #f3f5f1;     /* dressed stone */
  --surface-2: #dfe4de;
  --ink: #1d2a2f;         /* slate ink */
  --ink-soft: #4d5d61;
  --rule: #b9c3bd;
  --accent: #2c6a63;      /* verdigris */
  --accent-ink: #ffffff;
  --accent-soft: rgba(44, 106, 99, 0.12);
  --brass: #8a6a2c;
  --warn: #8c3b2a;
  --focus: #1f5fa8;
  --shadow: 0 1px 0 rgba(29, 42, 47, 0.06), 0 8px 28px -18px rgba(29, 42, 47, 0.35);
  --font-display: "IM Fell English", "IM Fell English SC", Georgia, "Times New Roman", serif;
  --font-display-sc: "IM Fell English SC", "IM Fell English", Georgia, serif;
  --font-body: "Literata", Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  --font-ui: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --size: 1.125rem;
  --measure: 36rem;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-hw-theme]) {
    --bg: #0e161a;
    --surface: #142027;
    --surface-2: #1b2a32;
    --ink: #d8e1de;
    --ink-soft: #97a8a6;
    --rule: #2c3d45;
    --accent: #6fb3a8;
    --accent-ink: #0e161a;
    --accent-soft: rgba(111, 179, 168, 0.14);
    --brass: #c9a55a;
    --warn: #e08b73;
    --focus: #8ab8ff;
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 10px 30px -18px rgba(0, 0, 0, 0.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]:not([data-hw-theme]),
:root[data-hw-theme="night"] {
  --bg: #0e161a;
  --surface: #142027;
  --surface-2: #1b2a32;
  --ink: #d8e1de;
  --ink-soft: #97a8a6;
  --rule: #2c3d45;
  --accent: #6fb3a8;
  --accent-ink: #0e161a;
  --accent-soft: rgba(111, 179, 168, 0.14);
  --brass: #c9a55a;
  --warn: #e08b73;
  --focus: #8ab8ff;
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 10px 30px -18px rgba(0, 0, 0, 0.8);
  color-scheme: dark;
}
:root[data-hw-theme="limestone"] {
  color-scheme: light;
}
:root[data-hw-theme="day"] {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f1f3f2;
  --ink: #161b1e;
  --ink-soft: #4a5357;
  --rule: #d4d9d7;
  --accent: #245f58;
  --accent-soft: rgba(36, 95, 88, 0.1);
  color-scheme: light;
}
:root[data-hw-font="sans"] { --font-body: "Barlow", "Helvetica Neue", Arial, sans-serif; }
:root[data-hw-width="wide"] { --measure: 44rem; }
:root[data-hw-width="narrow"] { --measure: 30rem; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--size);
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
a { color: var(--accent); }

/* ---------- top bar ---------- */
.hw-bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--rule);
}
.hw-bar-inner {
  max-width: calc(var(--measure) + 12rem);
  margin: 0 auto;
  padding: 0.45rem 16px;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
}
.hw-brand {
  font-family: var(--font-display-sc);
  font-size: 1.15rem;
  letter-spacing: 0.06em;
  margin-right: auto;
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  white-space: nowrap;
}
.hw-hum {
  font-family: var(--font-ui);
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.hw-hum b { color: var(--accent); font-weight: 600; letter-spacing: 0.04em; }
.hw-hum.low b { color: var(--warn); }
.hw-btn {
  font-family: var(--font-ui);
  font-size: 0.85rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: transparent;
  border: 1px solid var(--rule);
  color: var(--ink);
  padding: 0.35rem 0.7rem;
  border-radius: 3px;
  cursor: pointer;
}
.hw-btn:hover { border-color: var(--accent); color: var(--accent); }
.hw-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.hw-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.hw-btn.primary:hover { filter: brightness(1.07); color: var(--accent-ink); }
.hw-btn[disabled] { opacity: 0.45; cursor: default; }

/* ---------- layout ---------- */
.hw-main {
  max-width: calc(var(--measure) + 12rem);
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 1.5rem 5rem;
  display: grid;
  grid-template-columns: 5rem minmax(0, var(--measure)) 5rem;
  justify-content: center;
  column-gap: 1rem;
}
.hw-view { grid-column: 2; min-width: 0; }
.hw-gauge { grid-column: 1; grid-row: 1; justify-self: end; position: sticky; top: 5rem; align-self: start; }
@media (max-width: 760px) {
  .hw-main { grid-template-columns: minmax(0, 1fr); }
  .hw-view { grid-column: 1; }
  .hw-gauge { display: none; }
}

/* staff gauge: a dam's water-level marker, one mark per chapter */
.hw-gauge svg { display: block; }
.hw-gauge .g-label { font-family: var(--font-ui); font-size: 10px; letter-spacing: 0.12em; fill: var(--ink-soft); }
.hw-gauge .g-tick { fill: var(--ink); }
.hw-gauge .g-bar { fill: var(--ink); }
.hw-gauge .g-water { fill: var(--accent); opacity: 0.22; }
.hw-gauge .g-line { stroke: var(--accent); stroke-width: 2; }
.hw-gauge .g-num { font-family: var(--font-ui); font-size: 11px; fill: var(--ink); font-variant-numeric: tabular-nums; }
.hw-gauge .g-num.on { fill: var(--accent); font-weight: 700; }

/* ---------- story ---------- */
.hw-story { min-height: 0; }
.hw-story p { margin: 0 0 1em; hyphens: auto; -webkit-hyphens: auto; }
.hw-story p em { font-style: italic; }
.hw-chapter {
  text-align: center;
  margin: 1.25rem 0 2rem;
}
.hw-chapter .num {
  display: block;
  font-family: var(--font-ui);
  font-size: 0.78rem;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--brass);
}
.hw-chapter .title {
  display: block;
  font-family: var(--font-display);
  font-size: clamp(2rem, 6vw, 2.9rem);
  line-height: 1.1;
  margin-top: 0.35rem;
  text-wrap: balance;
}
.hw-chapter .rule {
  display: block;
  width: 4.5rem;
  height: 1px;
  background: var(--rule);
  margin: 1.1rem auto 0;
}
.hw-chapter + p::first-letter {
  font-family: var(--font-display);
  float: left;
  font-size: 3.4em;
  line-height: 0.82;
  padding: 0.08em 0.1em 0 0;
  color: var(--accent);
}
.hw-story h3 {
  font-family: var(--font-display-sc);
  font-weight: normal;
  font-size: 1.15rem;
  letter-spacing: 0.08em;
  text-align: center;
  color: var(--ink-soft);
  margin: 2rem 0 1.25rem;
}
.hw-story hr { border: 0; text-align: center; margin: 1.5rem 0; }
.hw-story hr::after { content: "\2042"; color: var(--ink-soft); }
.hw-fade { animation: hwfade 0.35s ease-out both; }
@keyframes hwfade { from { opacity: 0.001; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .hw-fade { animation: none; } }

.hw-changes {
  font-family: var(--font-ui);
  font-size: 0.82rem;
  letter-spacing: 0.06em;
  color: var(--ink-soft);
  margin: -0.25rem 0 1rem;
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem 0.9rem;
}
.hw-changes .up { color: var(--accent); }
.hw-changes .down { color: var(--warn); }

/* narrator states */
.hw-narr-note {
  font-family: var(--font-ui);
  font-size: 0.82rem;
  letter-spacing: 0.06em;
  color: var(--ink-soft);
  margin: 0 0 1rem;
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  align-items: center;
}
.hw-narr-note button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; font: inherit; letter-spacing: inherit; }
.hw-quill { display: inline-block; width: 0.6em; height: 0.6em; border-radius: 50%; background: var(--accent); animation: hwpulse 1.2s ease-in-out infinite; }
@keyframes hwpulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .hw-quill { animation: none; } }

/* ---------- choices (Choice-of-Games style radio list) ---------- */
.hw-choices { margin: 1.5rem 0 0; }
.hw-choice-list {
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--surface);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.hw-choice {
  display: grid;
  grid-template-columns: 1.4rem 1fr;
  gap: 0.6rem;
  align-items: start;
  padding: 0.72rem 1rem;
  cursor: pointer;
  border-top: 1px solid var(--rule);
  line-height: 1.45;
}
.hw-choice:first-child { border-top: 0; }
.hw-choice:hover { background: var(--accent-soft); }
.hw-choice input { margin: 0.3rem 0 0; accent-color: var(--accent); width: 1rem; height: 1rem; }
.hw-choice.selected { background: var(--accent-soft); }
.hw-choice.disabled { cursor: not-allowed; color: var(--ink-soft); }
.hw-choice.disabled:hover { background: transparent; }
.hw-choice.disabled .txt { opacity: 0.72; }
.hw-hint {
  display: block;
  font-family: var(--font-ui);
  font-size: 0.8rem;
  letter-spacing: 0.05em;
  color: var(--brass);
  margin-top: 0.15rem;
}
.hw-actions { display: flex; gap: 0.6rem; justify-content: flex-end; margin-top: 1rem; flex-wrap: wrap; }
.hw-actions .hw-btn { font-size: 0.95rem; padding: 0.55rem 1.4rem; }
.hw-input-row { display: flex; gap: 0.6rem; margin-top: 1rem; flex-wrap: wrap; }
.hw-input-row input {
  flex: 1 1 12rem;
  min-width: 0;
  padding: 0.55rem 0.75rem;
  border: 1px solid var(--rule);
  border-radius: 3px;
  background: var(--surface);
}

/* ---------- ending ---------- */
.hw-ending {
  margin-top: 2rem;
  padding: 1.75rem 1.5rem;
  border: 1px solid var(--rule);
  background: var(--surface);
  text-align: center;
  box-shadow: var(--shadow);
}
.hw-ending .eyebrow { font-family: var(--font-ui); letter-spacing: 0.3em; font-size: 0.78rem; text-transform: uppercase; color: var(--brass); }
.hw-ending h2 { font-family: var(--font-display); font-weight: normal; font-size: 2.2rem; margin: 0.35rem 0 0.5rem; text-wrap: balance; }
.hw-ending p { color: var(--ink-soft); margin: 0 auto 1rem; max-width: 30rem; }
.hw-ending .hw-actions { justify-content: center; }

/* ---------- panels: stats, saves, settings, gallery ---------- */
.hw-panel h2 {
  font-family: var(--font-display);
  font-weight: normal;
  font-size: 2rem;
  margin: 0.5rem 0 1.25rem;
}
.hw-panel h3 {
  font-family: var(--font-ui);
  font-size: 0.8rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--brass);
  margin: 2rem 0 0.75rem;
  font-weight: 600;
}
.hw-panel .lede { color: var(--ink-soft); margin-top: -0.75rem; }
.hw-rows { display: grid; gap: 0.7rem; }
.hw-row { display: grid; gap: 0.25rem; }
.hw-row-head {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  font-family: var(--font-ui);
  font-size: 0.95rem;
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
}
.hw-row-head .sub { color: var(--ink-soft); }
.hw-meter {
  position: relative;
  height: 0.55rem;
  background: var(--surface-2);
  border: 1px solid var(--rule);
  border-radius: 1px;
  overflow: hidden;
}
.hw-meter > span { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.hw-meter.opposed > span { background: var(--accent); }
.hw-meter.opposed::after {
  content: "";
  position: absolute;
  left: 50%;
  top: -1px;
  bottom: -1px;
  width: 1px;
  background: var(--ink-soft);
  opacity: 0.5;
}
.hw-person .hw-row-head .who { font-weight: 600; }
.hw-row .note { font-family: var(--font-body); font-size: 0.88rem; line-height: 1.4; color: var(--ink-soft); font-style: italic; }
.hw-idcard {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
  gap: 0.75rem 1.25rem;
  padding: 1rem 1.1rem;
  border: 1px solid var(--rule);
  background: var(--surface);
}
.hw-idcard div { display: grid; gap: 0.1rem; }
.hw-idcard .k { font-family: var(--font-ui); font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }
.hw-idcard .v { font-size: 1rem; }
.hw-vow {
  border: 1px solid var(--brass);
  border-left-width: 4px;
  padding: 0.6rem 0.9rem;
  background: var(--surface);
}
.hw-vow + .hw-vow { margin-top: 0.6rem; }
.hw-vow .name { font-family: var(--font-display-sc); font-size: 1.05rem; letter-spacing: 0.04em; }
.hw-vow .words { font-style: italic; }
.hw-vow .status { font-family: var(--font-ui); font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
.hw-vow.broken { border-color: var(--warn); }
.hw-vow.broken .words { text-decoration: line-through; }
.hw-journal { margin: 0; padding-left: 1.2rem; }
.hw-journal li { margin-bottom: 0.45rem; }
.hw-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.hw-table th, .hw-table td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--rule); }
.hw-table th { font-family: var(--font-ui); font-size: 0.75rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
.hw-table td.n, .hw-table th.n { text-align: right; }
.hw-scroll-x { overflow-x: auto; }

.hw-slots { display: grid; gap: 0.6rem; }
.hw-slot {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 0.5rem 1rem;
  align-items: center;
  padding: 0.75rem 0.9rem;
  border: 1px solid var(--rule);
  background: var(--surface);
}
.hw-slot .meta { font-family: var(--font-ui); letter-spacing: 0.04em; font-size: 0.9rem; color: var(--ink-soft); }
.hw-slot .label { font-weight: 600; }
.hw-slot .btns { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: flex-end; }
.hw-setting { display: grid; grid-template-columns: minmax(8rem, 12rem) minmax(0, 1fr); gap: 0.5rem 1rem; align-items: center; padding: 0.55rem 0; border-bottom: 1px solid var(--rule); }

}

}

.hw-card .d { font-size: 0.92rem; color: var(--ink-soft); }
.hw-card .c { font-family: var(--font-ui); font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--brass); }
.hw-card.locked .t { color: var(--ink-soft); }
.hw-card.locked { background: transparent; border-style: dashed; }

/* ---------- title screen ---------- */
.hw-title { text-align: center; padding-top: 1rem; }
.hw-title .eyebrow { font-family: var(--font-ui); letter-spacing: 0.34em; font-size: 0.78rem; text-transform: uppercase; color: var(--brass); }
.hw-title h1 {

  letter-spacing: 0.06em;
  line-height: 1;
  margin: 0.4rem 0 0.3rem;
}
.hw-title .sub { font-style: italic; color: var(--ink-soft); margin: 0 0 1.25rem; }
.hw-title .motto { font-family: var(--font-display-sc); letter-spacing: 0.22em; font-size: 0.95rem; color: var(--ink-soft); margin-top: 1.5rem; }
.hw-title .menu { display: grid; gap: 0.55rem; max-width: 18rem; margin: 1.5rem auto 0; }
.hw-title .menu .hw-btn { font-size: 1rem; padding: 0.7rem 1rem; }
.hw-title .stats-line { font-family: var(--font-ui); font-size: 0.85rem; letter-spacing: 0.08em; color: var(--ink-soft); margin-top: 1.25rem; }
.hw-dam { width: 100%; max-width: 30rem; height: auto; margin: 0.5rem auto 0; display: block; }
.hw-dam .stone { fill: var(--surface-2); stroke: var(--ink); stroke-width: 1.4; }
.hw-dam .hatch { stroke: var(--ink-soft); stroke-width: 0.6; opacity: 0.55; }
.hw-dam .water { fill: var(--accent); opacity: 0.18; }
.hw-dam .surface { stroke: var(--accent); stroke-width: 1.6; fill: none; }
.hw-dam .ground { stroke: var(--ink); stroke-width: 1.2; }
.hw-dam .dim { stroke: var(--ink-soft); stroke-width: 0.8; }

.hw-dam .ripple { animation: hwripple 6s ease-in-out infinite; transform-origin: center; }
@keyframes hwripple { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-6px); } }
@media (prefers-reduced-motion: reduce) { .hw-dam .ripple { animation: none; } }

/* ---------- toast ---------- */
.hw-toast {

  .hw-actions .hw-btn { flex: 1 1 auto; }
}

<script>
/* Heldwater engine — expression compiler.
 * Compiles ChoiceScript-flavoured expressions into cached JS functions.
 *   and / or / not, = (equality), !=, <, <=, >, >=, + - * / %, "strings", true / false
 * Identifiers are resolved through a lookup function so unknown names fail loudly.
 */
(function (root) {
  "use strict";
  var HW = root.HW || (root.HW = {});

  var KEYWORDS = { and: "&&", or: "||", not: "!", true: "true", false: "false" };
  var cache = Object.create(null);

  function tokenize(src) {
    var tokens = [];
    var i = 0;
    var n = src.length;
    while (i < n) {
      var c = src[i];
      if (c === " " || c === "\t") { i++; continue; }
      if (c === '"') {
        var j = i + 1;
        var s = "";
        while (j < n && src[j] !== '"') {
          if (src[j] === "\\" && j + 1 < n) { s += src[j + 1]; j += 2; continue; }
          s += src[j]; j++;
        }
        if (j >= n) throw new Error("Unterminated string in expression: " + src);
        tokens.push({ t: "str", v: s });
        i = j + 1;
        continue;
      }
      if (/[0-9]/.test(c) || (c === "." && /[0-9]/.test(src[i + 1] || ""))) {
        var m = /^[0-9]*\.?[0-9]+/.exec(src.slice(i));
        tokens.push({ t: "num", v: m[0] });
        i += m[0].length;
        continue;
      }
      if (/[A-Za-z_]/.test(c)) {
        var id = /^[A-Za-z_][A-Za-z0-9_]*/.exec(src.slice(i))[0];
        tokens.push({ t: "id", v: id });
        i += id.length;
        continue;
      }
      var two = src.substr(i, 2);
      if (two === "<=" || two === ">=" || two === "!=" || two === "==" || two === "&&" || two === "||") {
        tokens.push({ t: "op", v: two });
        i += 2;
        continue;
      }
      if ("+-*/%()<>=!&,".indexOf(c) >= 0) {
        tokens.push({ t: "op", v: c });
        i++;
        continue;
      }
      throw new Error("Unexpected character '" + c + "' in expression: " + src);
    }
    return tokens;
  }

  function toJS(tokens) {
    var out = [];
    for (var k = 0; k < tokens.length; k++) {
      var tk = tokens[k];
      if (tk.t === "str") out.push(JSON.stringify(tk.v));
      else if (tk.t === "num") out.push(tk.v);
      else if (tk.t === "id") {
        if (Object.prototype.hasOwnProperty.call(KEYWORDS, tk.v)) out.push(KEYWORDS[tk.v]);
        else out.push("$v(" + JSON.stringify(tk.v) + ")");
      } else {
        var v = tk.v;
        if (v === "=" || v === "==") out.push("===");
        else if (v === "!=") out.push("!==");
        else if (v === "&") out.push("+"); // ChoiceScript string concatenation
        else out.push(v);
      }
    }
    return out.join(" ");
  }

  /** Returns the identifiers (variable names) an expression refers to. */
  function identifiers(src) {
    return tokenize(src)
      .filter(function (t) { return t.t === "id" && !Object.prototype.hasOwnProperty.call(KEYWORDS, t.v); })
      .map(function (t) { return t.v; });
  }

  /** Compile an expression into function(lookup) -> value. */
  function compile(src) {
    var key = src;
    if (cache[key]) return cache[key];
    var js = toJS(tokenize(src));
    var fn;
    try {
      fn = new Function("$v", "return (" + js + ");");
    } catch (e) {
      throw new Error("Bad expression '" + src + "': " + e.message);
    }
    cache[key] = fn;
    return fn;
  }

  HW.expr = { compile: compile, identifiers: identifiers, tokenize: tokenize };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* Heldwater engine — inline text markup.
 *   {var}            variable value (HTML-escaped)
 *   {!var}           variable value with first letter capitalised
 *   {@expr|a|b}      boolean: a if true, b if false.  number n: the nth option (1-based)
 *   {~a|b|c}         narrative variant, chosen per playthrough (stable on reload)
 *   {expr}           any other expression is evaluated and printed
 *   [i]..[/i]  [b]..[/b]
 * Straight quotes become typographic quotes.
 */
(function (root) {
  "use strict";
  var HW = root.HW || (root.HW = {});

  function escapeHTML(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // Find the index of the "}" matching the "{" at position `open`.
  function matchBrace(s, open) {
    var depth = 0;
    for (var i = open; i < s.length; i++) {
      if (s[i] === "{") depth++;
      else if (s[i] === "}") {
        depth--;
        if (depth === 0) return i;
      }
    }
    return -1;
  }

  // Split on "|" that are not nested inside braces.
  function splitTop(s) {
    var parts = [];
    var depth = 0;
    var cur = "";
    for (var i = 0; i < s.length; i++) {
      var c = s[i];
      if (c === "{") depth++;
      if (c === "}") depth--;
      if (c === "|" && depth === 0) { parts.push(cur); cur = ""; continue; }
      cur += c;
    }
    parts.push(cur);
    return parts;
  }

  function capitalize(s) {
    s = String(s);
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  /**
   * Render markup to HTML.
   * ctx: { get(name), evalExpr(src), variant(count, occurrence) -> index }
   */
  function render(src, ctx) {
    var state = { occurrence: 0 };
    var html = renderInner(src, ctx, state);
    return finish(html);
  }

  function renderInner(src, ctx, state) {
    var out = "";
    var i = 0;
    while (i < src.length) {
      var c = src[i];
      if (c === "{") {
        var close = matchBrace(src, i);
        if (close < 0) throw new Error("Unclosed '{' in: " + src);
        var body = src.slice(i + 1, close);
        out += renderToken(body, ctx, state);
        i = close + 1;
        continue;
      }
      out += escapeHTML(c);
      i++;
    }
    return out;
  }

  function renderToken(body, ctx, state) {
    var lead = body.charAt(0);
    if (lead === "~") {
      var opts = splitTop(body.slice(1));
      var idx = ctx.variant(opts.length, state.occurrence++);
      return renderInner(opts[idx] || "", ctx, state);
    }
    if (lead === "@") {
      var parts = splitTop(body.slice(1));
      var cond = parts.shift();
      var val = ctx.evalExpr(cond.trim());
      var pick;
      if (typeof val === "number") pick = parts[Math.max(0, Math.min(parts.length - 1, Math.round(val) - 1))];
      else pick = val ? parts[0] : parts[1];
      return renderInner(pick || "", ctx, state);
    }
    if (lead === "!") {
      return escapeHTML(capitalize(ctx.evalExpr(body.slice(1).trim())));
    }
    var v = ctx.evalExpr(body.trim());
    return escapeHTML(v === undefined || v === null ? "" : v);
  }

  function smartQuotes(s) {
    // Operates on text that may contain <em>/<strong> tags (no attributes, no quotes inside).
    s = s.replace(/(^|[\s(\[])"(?=\S)/g, "$1“");
    s = s.replace(/(<em>|<strong>)"(?=\S)/g, "$1“");
    s = s.replace(/([—–])"(?=[^\s.,;:!?)—])/g, "$1“");
    s = s.replace(/"/g, "”");
    s = s.replace(/(^|[\s(\[“])'(?=[A-Za-z])/g, "$1‘");
    s = s.replace(/(<em>|<strong>)'(?=[A-Za-z])/g, "$1‘");
    s = s.replace(/'/g, "’");
    return s;
  }

  function finish(html) {
    html = html
      .replace(/\[i\]/g, "<em>").replace(/\[\/i\]/g, "</em>")
      .replace(/\[b\]/g, "<strong>").replace(/\[\/b\]/g, "</strong>");
    return smartQuotes(html);
  }

  /** Plain text version (for the narrator / tests). */
  function toPlain(html) {
    return String(html)
      .replace(/<\/?em>/g, "*")
      .replace(/<\/?strong>/g, "**")
      .replace(/<[^>]+>/g, "")
      .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&");
  }

  HW.text = { render: render, escapeHTML: escapeHTML, splitTop: splitTop, toPlain: toPlain, smartQuotes: smartQuotes };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* Heldwater engine — scene parser.
 * Turns a scene's script into a flat line table with indentation metadata, labels,
 * and pre-computed choice / vary structure. Execution is line-based (like ChoiceScript).
 */
(function (root) {
  "use strict";
  var HW = root.HW || (root.HW = {});

  var COMMANDS = {
    comment: 1, label: 1, goto: 1, goto_scene: 1, gosub: 1, gosub_scene: 1, "return": 1, finish: 1,
    set: 1, temp: 1, "if": 1, "elseif": 1, "else": 1, choice: 1, fake_choice: 1, page_break: 1,
    chapter: 1, heading: 1, ending: 1, achieve: 1, journal: 1, input_text: 1, rand: 1, vary: 1,
    bug: 1, line_break: 1, divider: 1, commit_stats: 1
  };

  var OPTION_MODS = { "if": 1, selectable_if: 1, hide_reuse: 1, disable_reuse: 1 };

  function ParseError(scene, lineNo, msg) {
    var e = new Error("[" + scene + ":" + lineNo + "] " + msg);
    e.scene = scene;
    e.line = lineNo;
    return e;
  }

  // Read a balanced "( ... )" group at the start of s. Returns {expr, rest} or null.
  function readParens(s) {
    s = s.replace(/^\s+/, "");
    if (s.charAt(0) !== "(") return null;
    var depth = 0;
    var inStr = false;
    for (var i = 0; i < s.length; i++) {
      var c = s[i];
      if (c === '"') inStr = !inStr;
      if (inStr) continue;
      if (c === "(") depth++;
      else if (c === ")") {
        depth--;
        if (depth === 0) return { expr: s.slice(1, i).trim(), rest: s.slice(i + 1) };
      }
    }
    return null;
  }

  // Strip optional wrapping parentheses around a whole condition: "(a and b)" -> "a and b".
  function condExpr(args) {
    var p = readParens(args);
    if (p && p.rest.trim() === "") return p.expr;
    return args.trim();
  }

  /** Try to parse an option line: modifiers then "#Text". Returns null if not an option. */
  function parseOption(text) {
    var mods = [];
    var s = text;
    for (;;) {
      var m = /^\*(\w+)\s*/.exec(s);
      if (!m || !OPTION_MODS[m[1]]) break;
      var rest = s.slice(m[0].length);
      if (m[1] === "if" || m[1] === "selectable_if") {
        var p = readParens(rest);
        if (!p) return null;
        mods.push({ type: m[1], expr: p.expr });
        s = p.rest.replace(/^\s+/, "");
      } else {
        mods.push({ type: m[1] });
        s = rest;
      }
    }
    if (s.charAt(0) !== "#") return null;
    return { text: s.slice(1).trim(), mods: mods };
  }

  function parse(sceneName, source) {
    var rawLines = source.replace(/\r\n?/g, "\n").split("\n");
    var lines = [];
    var labels = Object.create(null);

    for (var i = 0; i < rawLines.length; i++) {
      var raw = rawLines[i].replace(/\t/g, "    ");
      var trimmed = raw.trim();
      var line = { n: i + 1, indent: 0, kind: "blank", raw: trimmed };
      if (trimmed === "") {
        lines.push(line);
        continue;
      }
      line.indent = raw.length - raw.replace(/^ +/, "").length;
      if (trimmed.charAt(0) === "*") {
        var opt = parseOption(trimmed);
        if (opt) {
          line.kind = "option";
          line.opt = opt;
        } else {
          var m = /^\*(\w+)\s*(.*)$/.exec(trimmed);
          if (!m) throw ParseError(sceneName, i + 1, "Malformed command: " + trimmed);
          if (!COMMANDS[m[1]]) throw ParseError(sceneName, i + 1, "Unknown command *" + m[1]);
          line.kind = "cmd";
          line.cmd = m[1];
          line.args = m[2];
          if (m[1] === "comment") line.kind = "blank-comment";
          if (m[1] === "label") {
            var name = m[2].trim();
            if (labels[name] !== undefined) throw ParseError(sceneName, i + 1, "Duplicate label " + name);
            labels[name] = lines.length;
          }
        }
      } else if (trimmed.charAt(0) === "#") {
        line.kind = "option";
        line.opt = { text: trimmed.slice(1).trim(), mods: [] };
      } else if (trimmed === "~") {
        line.kind = "vary_opt";
      } else {
        line.kind = "text";
      }
      lines.push(line);
    }

    // Comments behave like nothing at all (not even paragraph breaks).
    for (var c = 0; c < lines.length; c++) if (lines[c].kind === "blank-comment") lines[c].kind = "nop";

    // blockEnd: next substantive line with indent <= this line's indent.
    var stack = [];
    for (var k = 0; k < lines.length; k++) {
      var L = lines[k];
      if (L.kind === "blank" || L.kind === "nop") continue;
      while (stack.length && lines[stack[stack.length - 1]].indent >= L.indent) {
        lines[stack.pop()].blockEnd = k;
      }
      stack.push(k);
    }
    while (stack.length) lines[stack.pop()].blockEnd = lines.length;

    // Choice and vary structure.
    for (var q = 0; q < lines.length; q++) {
      var Q = lines[q];
      if (Q.kind === "cmd" && (Q.cmd === "choice" || Q.cmd === "fake_choice")) {
        Q.tree = buildOptionTree(sceneName, lines, q + 1, Q.blockEnd, Q.indent, Q.blockEnd);
        if (!Q.tree.length) throw ParseError(sceneName, Q.n, "*choice has no options");
        if (Q.blockEnd < lines.length) lines[Q.blockEnd].afterChoice = true;
      } else if (Q.kind === "cmd" && Q.cmd === "vary") {
        Q.variants = [];
        var childIndent = null;
        for (var v = q + 1; v < Q.blockEnd; v++) {
          var V = lines[v];
          if (V.kind === "blank" || V.kind === "nop") continue;
          if (childIndent === null) childIndent = V.indent;
          if (V.indent !== childIndent) continue;
          if (V.kind !== "vary_opt") throw ParseError(sceneName, V.n, "Expected '~' inside *vary");
          V.structEnd = Q.blockEnd;
          Q.variants.push(v);
        }
        if (!Q.variants.length) throw ParseError(sceneName, Q.n, "*vary has no '~' variants");
        if (Q.blockEnd < lines.length) lines[Q.blockEnd].afterChoice = true;
      }
    }

    // Sanity: stray options / variants outside a structure.
    for (var s = 0; s < lines.length; s++) {
      var S = lines[s];
      if ((S.kind === "option" || S.kind === "vary_opt") && S.structEnd === undefined) {
        throw ParseError(sceneName, S.n, "Option or '~' outside of a *choice / *vary");
      }
    }

    return { name: sceneName, lines: lines, labels: labels };
  }

  // Build the list of options for a *choice between [start, end).
  function buildOptionTree(scene, lines, start, end, parentIndent, choiceEnd) {
    var nodes = [];
    var childIndent = null;
    var k = start;
    while (k < end) {
      var L = lines[k];
      if (L.kind === "blank" || L.kind === "nop") { k++; continue; }
      if (childIndent === null) childIndent = L.indent;
      if (L.indent !== childIndent) {
        throw ParseError(scene, L.n, "Inconsistent indentation inside *choice");
      }
      if (L.kind === "option") {
        L.structEnd = choiceEnd;
        nodes.push({ type: "opt", idx: k });
        k = L.blockEnd;
        continue;
      }
      if (L.kind === "cmd" && L.cmd === "if") {
        var branches = [];
        var j = k;
        for (;;) {
          var B = lines[j];
          B.structEnd = choiceEnd;
          var expr = B.cmd === "else" ? null : condExpr(B.args);
          branches.push({ expr: expr, nodes: buildOptionTree(scene, lines, j + 1, B.blockEnd, B.indent, choiceEnd) });
          var nx = B.blockEnd;
          while (nx < end && (lines[nx].kind === "blank" || lines[nx].kind === "nop")) nx++;
          if (nx < end && lines[nx].kind === "cmd" && lines[nx].indent === B.indent &&
              (lines[nx].cmd === "elseif" || lines[nx].cmd === "else")) {
            j = nx;
            continue;
          }
          k = nx;
          break;
        }
        nodes.push({ type: "cond", branches: branches });
        continue;
      }
      if (L.kind === "cmd" && L.cmd === "comment") { k++; continue; }
      throw ParseError(scene, L.n, "Only #options (or *if groups of them) may appear directly inside *choice");
    }
    return nodes;
  }

  HW.parser = { parse: parse, parseOption: parseOption, condExpr: condExpr, readParens: readParens };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* Heldwater engine — interpreter.
 * Executes a scene's line table until it must yield to the player:
 *   choice | page_break | input | ending
 * Holds no DOM references, so it runs identically in the browser and in Node (tests / bots).
 */
(function (root) {
  "use strict";
  var HW = root.HW || (root.HW = {});

  var STEP_LIMIT = 200000;

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  // Small deterministic hash -> [0, 2^32)
  function hash32(str) {
    var h = 2166136261 >>> 0;

    try {
      var s = ls();
      if (s) s.setItem(PREFIX + key, raw);
      else memory[key] = raw;
      return true;
    } catch (e) {

      return false;
    }
  }

  function remove(key) {
    try {
      var s = ls();
      if (s) s.removeItem(PREFIX + key);

<script>
/* Heldwater engine — the Living Narrator.
 * Retells each page in a chosen voice while keeping every fact, name and choice intact.
 * Two backends:
 *   "claude" — the claude.ai artifact runtime's sample() capability (viewer's own Claude account)
 *   "api"    — the official Anthropic SDK (loaded on demand from jsDelivr) with the player's API key
 * Any failure resolves to null so the UI falls back to the original text.
 */
(function (root) {
  "use strict";
  var HW = root.HW || (root.HW = {});

  var SDK_URL = "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk/+esm";

  var VOICES = {
    faithful: { label: "Faithful", desc: "Close to the page, freshly worded.",
      text: "Stay close to the original's tone and rhythm; change the wording, imagery and sentence shapes so it reads as a fresh telling of the same moment." },
    lyrical: { label: "Lyrical", desc: "Richer imagery, longer breath.",
      text: "Lyrical and sensory: water, stone, light, sound. Longer sentences where the moment is still; short ones where it is sharp. Never purple." },
    wry: { label: "Wry", desc: "Dry humour, sharp eye.",
      text: "Dry, observant and quietly funny, like a narrator who has seen a great many institutions fail. Humour must never undercut grief or danger when the passage is serious." },
    gothic: { label: "Gothic", desc: "Dread, damp and shadow.",
      text: "Gothic: dread, damp stone, the weight of the water always pressing. Atmosphere over melodrama. Keep dialogue natural." },
    spare: { label: "Spare", desc: "Terse. Every word earns its place.",
      text: "Spare and exact. Short declarative sentences. Cut adjectives. Let silences do the work." },
    fireside: { label: "Fireside", desc: "Told aloud, years later.",
      text: "As if told aloud by an old Scarrow storyteller, years afterwards, to someone who was there: warm, rhythmic, a little rueful. Still second person, still present tense." }
  };

  var GLOSSARY = [
    "Setting: Scarrow, an industrial river city below the Stay, a vast stone arch dam holding back the Heldwater (a reservoir) over the drowned village of Hebble.",
    "The College of the Stay is inside the dam. Students belong to Watches (Crest, Sluice, Gallery, Footing).",
    "Magic: vows ('I will not ...') give 'purchase'; using it is 'leaning'; breaking a vow is 'the snap'. The Keystone is the one person bound to hold the Stay. The Crown is the prize of three trials.",
    "Names to spell exactly: Tamsin Mottram, Ptolemy 'Tolly' Varnish, Sal Quaile (they/them), Hob Gorringe, Warden Agnes Brathwaite, Master Ambrose Fell, Dr. Odile Marchbank, Mr. Quentin Ebbing, Hester Quaile, Nan Win Mottram, Councillor Honoria Varnish, Rilla Hesketh, Mr. Ezra Dunnock, Old Samuel, Pip, Josiah Thwaite, the Weir Lift, the Throat, the Sump, the Rows, the Nethers, Crowhill, the Cut, Lisk."
  ].join("\n");

  var RULES = [
    "You are the narrator of HELDWATER, an interactive novel in the tradition of Choice of Games: second person, present tense, literary but readable.",
    "Retell the PASSAGE in the requested VOICE. The player has already read nothing of this passage; your telling replaces it.",
    "Hard rules:",
    "1. Keep every event, fact, name, number, object, relationship and consequence. Add nothing new: no new events, people, objects, backstory, foreshadowing or information. Remove nothing that matters.",
    "2. Second person ('you'), present tense, unless the original uses past tense for memories.",
    "3. Dialogue: keep who says what and what it means. Keep short lines and any line in quotation marks that sounds like a key phrase exactly; you may lightly rephrase longer speech. Keep each character's voice.",
    "4. Do not mention choices, options, stats, the player, or the act of retelling. Do not summarise; narrate.",
    "5. Keep roughly the same length (within a quarter) and a similar number of paragraphs.",
    "6. Output ONLY the retold passage as plain paragraphs separated by one blank line. Use *asterisks* for emphasis sparingly. No headings, no preamble, no closing remarks."
  ].join("\n");

  function playerLine(facts) {
    return "Player character: " + facts.name + (facts.surname ? " " + facts.surname : "") +
      " (pronouns " + facts.pronouns + "). Background: " + facts.background + ".";
  }

  function buildUser(passage, facts, voiceKey) {
    var voice = VOICES[voiceKey] || VOICES.faithful;
    return playerLine(facts) + "\nVOICE: " + voice.label + " — " + voice.text +
      "\n\nPASSAGE:\n<<<\n" + passage + "\n>>>";
  }

  /* ---------------- backends ---------------- */

  var samplePromise = null;
  function getSample() {
    if (!samplePromise) {
      if (root.claude && typeof root.claude.use === "function") {
        samplePromise = Promise.resolve(root.claude.use("sample")).catch(function () { return null; });
      } else {
        samplePromise = Promise.resolve(null);
      }
    }
    return samplePromise;
  }

  var sdkPromise = null;
  function getSDK() {
    if (!sdkPromise) {
      sdkPromise = import(SDK_URL).then(function (mod) { return mod.default || mod.Anthropic; });
      sdkPromise.catch(function () { sdkPromise = null; });
    }
    return sdkPromise;
  }

  /** Which backends can run here. Resolves {claude: bool, api: true}. */
  function availability() {
    return getSample().then(function (s) { return { claude: !!s, api: true }; });
  }

  function retellWithSample(passage, facts, settings, onText, signal) {
    return getSample().then(function (sample) {
      if (!sample) throw { code: "unavailable", message: "In-app Claude is not available here." };
      var prompt = RULES + "\n\n" + GLOSSARY + "\n\n" + buildUser(passage, facts, settings.voice);
      return sample(prompt, {
        onText: function (u) { onText(u.text); },
        signal: signal,
        modelTier: settings.tier === "default" ? "default" : "quick",
        cache: settings.fresh ? false : true
      }).then(function (res) { return res.text; });
    });
  }

  function retellWithAPI(passage, facts, settings, onText, signal) {
    if (!settings.apiKey) return Promise.reject({ code: "no_key", message: "Add an Anthropic API key in Settings." });
    return getSDK().then(function (Anthropic) {
      var client = new Anthropic({ apiKey: settings.apiKey, dangerouslyAllowBrowser: true });
      var model = settings.model || "claude-opus-5";
      var params = {
        model: model,
        max_tokens: 16000,
        system: [{ type: "text", text: RULES + "\n\n" + GLOSSARY, cache_control: { type: "ephemeral" } }],
        messages: [{ role: "user", content: buildUser(passage, facts, settings.voice) }]
      };
      if (model === "claude-opus-5" || model === "claude-sonnet-5") params.output_config = { effort: "low" };
      var stream;
      if (model === "claude-opus-5") {
        params.betas = ["server-side-fallback-2026-07-01"];
        params.fallbacks = "default";
        stream = client.beta.messages.stream(params, { signal: signal });
      } else {
        stream = client.messages.stream(params, { signal: signal });
      }
      var text = "";
      return (async function () {
        for await (var ev of stream) {
          if (ev.type === "content_block_start" && ev.content_block && ev.content_block.type === "fallback") {
            text = ""; // a declined attempt was replaced server-side; start over
          } else if (ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta") {
            text += ev.delta.text;
            onText(text);
          }
        }
        var final = await stream.finalMessage();
        if (final.stop_reason === "refusal") throw { code: "refused", message: "The narrator declined this passage." };
        return text;
      })().catch(function (err) {
        if (err && err.code) throw err;
        var msg = "The narrator is unavailable.";
        if (Anthropic.AuthenticationError && err instanceof Anthropic.AuthenticationError) msg = "Your API key was rejected.";
        else if (Anthropic.PermissionDeniedError && err instanceof Anthropic.PermissionDeniedError) msg = "This API key can't use that model.";
        else if (Anthropic.NotFoundError && err instanceof Anthropic.NotFoundError) msg = "That model isn't available to this key.";
        else if (Anthropic.RateLimitError && err instanceof Anthropic.RateLimitError) msg = "Rate limited — the narrator will be back shortly.";
        else if (Anthropic.APIUserAbortError && err instanceof Anthropic.APIUserAbortError) msg = "cancelled";
        else if (Anthropic.APIConnectionError && err instanceof Anthropic.APIConnectionError) msg = "Couldn't reach the Claude API (offline?).";
        else if (err && err.name === "AbortError") msg = "cancelled";
        throw { code: msg === "cancelled" ? "cancelled" : "api_error", message: msg };
      });
    }, function () {
      throw { code: "sdk_load", message: "Couldn't load the Claude SDK (offline?)." };
    });
  }

  /**
   * Retell a passage. Resolves the retold text, or rejects {code, message}.
   * settings: { backend: "claude"|"api", voice, tier, model, apiKey, fresh }
   */
  function retell(passage, facts, settings, onText, signal) {
    if (settings.backend === "claude") return retellWithSample(passage, facts, settings, onText, signal);
    return retellWithAPI(passage, facts, settings, onText, signal);
  }

  /** Convert plain retold text into paragraph HTML strings. */
  function toParagraphs(text) {
    return String(text).trim().split(/\n\s*\n/).map(function (p) {
      var h = HW.text.escapeHTML(p.replace(/\s*\n\s*/g, " ").trim());
      h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\*([^*]+)\*/g, "<em>$1</em>");
      return HW.text.smartQuotes(h);
    }).filter(function (p) { return p.length; });
  }

  HW.narrator = {
    /** Test hook: supply an SDK constructor instead of loading it from the CDN. */
    _setSDK: function (Ctor) { sdkPromise = Promise.resolve(Ctor); },
    voices: VOICES,
    availability: availability,
    retell: retell,
    toParagraphs: toParagraphs,
    models: [
      { id: "claude-opus-5", label: "Claude Opus 5 (best prose)" },
      { id: "claude-sonnet-5", label: "Claude Sonnet 5 (faster)" },
      { id: "claude-haiku-4-5", label: "Claude Haiku 4.5 (fastest, cheapest)" }
    ]
  };
})(typeof window !== "undefined" ? window : globalThis);

*chapter 1 The Face of the Stay
The Weir Lift takes eleven minutes to climb the face of the Stay, and for the first four of them you can still tell yourself you are only going somewhere.

The car is a varnished wooden box the size of a pantry, hauled up four hundred feet of stone on a cable as thick as your wrist. Through the window slats Scarrow falls away beneath you: {~the dye-works bleeding blue into the river, the Cut shining like a knife laid down on a table, a hundred thousand chimneys all breathing at once|slate roofs packed tight as herring in a crate, the canal flashing between them, smoke going up from every chimney in the city like a congregation getting to its feet|the river, the Cut, the mills and the steeples, the whole smoking city shrinking to the size of a map somebody has left out in the rain}. On the other side, close enough to touch if the slats were wider, is the wall.

Close up, the Stay is not the clean white arch on the postcards. It is limestone gone the color of old teeth, streaked with long rust-red tears beneath its weep-holes, and it sweats. Water beads on it in the morning cold and runs down in threads. Somewhere behind it (you can't see it from here; nobody in Scarrow ever sees it from here) eleven miles of lake is leaning on the other side of this wall like a crowd against a door.

And the Stay hums. Everyone knows that. B-flat, the tuning-fork men say, though down in the city you stop hearing it about the time you're old enough to argue with your mother. Up here you can't not hear it. It comes up through the floor of the car and into the bones of your feet.

You have one hand on the brass rail. In the other, you are holding—

*choice

    *set bg "levy"
    *set nerve 30
    *set sway 25
    *set lore 15
    *set finesse 15

    Mam's letter is mostly instructions. [i]Mind the lift. Mind the damp. Mind your manners with the Crowhill lot, and don't let them mind you.[/i] Folded inside it is the real letter: a drawing in wax crayon by your brother Pip, who is ten and believes this is the most important thing that has ever happened to anyone. He has drawn the Stay with a face. It is smiling. On top of it stands a figure with enormous hands, labelled YOU.

    You grew up at Number Three Lock on the Cut, in the lock-keeper's cottage, in the Nethers: the lowest wards of the city, right under the wall, where the hum is loud enough to walk the spoons across the table. You passed the Levy examination in the spring. The city pays your fees. In exchange the city owns seven years of you after you graduate, which Mam says is a better bargain than the mills ever offered anybody.

    The letter goes into your inside pocket, over your heart, because nobody's looking.
    *commit_stats
  #—nothing at all. My trunk went up yesterday with the family porter, and my hands don't know what to do with themselves.
    *set bg "legacy"

    Your mother saw you to the lift station in her court coat, because the Council's Stay Committee sits at nine, and she is its counsel, and the Committee does not wait for anybody's child. Her parting instruction was [i]Be kind to the Varnish boy, and don't sign anything.[/i] Then she kissed your forehead as if she were stamping a document, and went.

    Your family has been Sworn for five generations. Your grandfather sat on the College's Board of Governors; his portrait hangs on Crowhill, looking disappointed in oils. Your parents are famous, in a small way, for the one thing they refused to do. When you were born they would not cradle-swear you. They would not stand over your crib and make a promise in your name, the way the old families still quietly do. The [i]Courier[/i] called your mother "a modern woman." Your grandmother didn't speak to her for a year.

    So you arrive at the College of the Stay the way almost nobody from Crowhill does: owing nothing, bound by no word but your own. Your hands still don't know what to do. You put them in your pockets. You take them out again.

    You were eight when you stole. It was at your father's graveside, in the wind, with your mother's hand crushing yours, and you said it the way children say things, [i]I won't cry, I won't, I will not weep,[/i] and something in the world heard you and said [i]done.[/i]

    You have not cried since. Not when your mother sold the boat. Not when the minister called it a curse in front of the whole congregation. Not on the ferry, watching Lisk go down into the sea behind you. Things happen near you, sometimes: a door that won't close, a lamp that won't gutter in a gale. When the College's recruiter came through the fishing villages asking after children like that, your mother packed your bag before he'd finished his tea.

You are not alone in the car.

Old Samuel runs the Weir Lift, and has run it, he told you at the bottom, for thirty years "without once dropping a scholar, though God knows I've been tempted." He stands at his levers like a man at the wheel of a ship, a stubby pipe clenched unlit in his teeth.

On the bench opposite sits a young woman in a laundress's coat, patched at both elbows, reading a book whose spine has been broken so many times it opens by itself. Her hair is scraped back hard. Her boots are older than she is. On a grubby string around her neck hangs a big iron key, rusted to the color of dried blood. She has not looked up once.

And beside you, taking up a good deal more of the car than his body strictly requires, is a young man in a coat that cost more than the lift. He has been talking since the doors closed.

"—which is why I've never trusted funiculars, as a class. Too much faith involved. A staircase, now. A staircase never asked anyone to believe in anything." He turns the full beam of his attention on you. He has a face like a well-bred spaniel's, all eyes and eagerness, and a voice that could order off a wine list or a cavalry charge. "Ptolemy Varnish. Tolly, please. Ptolemy sounds like a pharaoh with a head cold. And you are—"

Without looking up, the young woman says, "Mottram."

"Mottram! Splendid. Just Mottram, like a cathedral?"

She turns a page she hasn't read. "Tamsin Mottram. There. You've got my name and I've got yours, and we can stop."

At minute six, the Stay changes its note.

You feel it before you hear it: a sag in the floor of the world, like a stair that isn't there. The hum drops. Not much, half a tone, a string gone slack. Every hair on your arms stands up. Tamsin Mottram's head comes up out of her book like a dog's.

*set hum "A"
Then the car stops.

It stops the way a dropped plate stops: all at once, with a bang that goes through your knees. The cable sings. The car swings out from the wall and back, and for one sick second you can see straight down between the floorboards to the roofs of the Nethers, three hundred feet below, {~toy-small and very hard-looking|small as a model railway and not half so forgiving|tidy as a tray of type, and as hard}.

A weep-hole in the face of the Stay beside the car coughs. It actually coughs, a wet stone throat clearing. Then a jet of water as thick as your arm comes out of it sideways, straight through the window slats, and hits Tolly Varnish full in the chest.

"Ah," says Tolly. "[i]Ah.[/i] Is this—tell me this is a normal Tuesday."

"It's Thursday," says Tamsin, standing up.

Old Samuel is shouting. The great brake lever has snapped back on its ratchet and caught his hand against the iron housing. He heaves at it with the other, face gone grey, pipe gone somewhere. "Dog's thrown," he says through his teeth. "Safety dog's thrown and it's caught my—the brake'll hold, it'll hold, but I can't—somebody—"

The car swings again. The jet hammers the slats and shoves the car out from the wall, and each time it swings back its iron roof-shoe scrapes the stone with a noise like a knife on a plate.

    He clutches it to his chest. "Dog's still thrown," he pants. "It's on the rack, up top. Somebody's got to knock it back or we sit here till they winch us, and they'll not winch us in this."

    You see the safety dog: an iron tooth, jammed crooked in a toothed rack on the guide rail. You kick it. It doesn't move. You kick it again and the car bucks, and your foot goes out from under you, and for a moment you are holding the cable with both hands and nothing else, and Scarrow is very, very far down.

[i]Leaning,[/i] you think. That's what that is. That's what they come up here to learn. But first-years can't lean. You have to be sworn to lean, and nobody is sworn before the Oathing.

*page_break Up to the crest

The car docks at the top in a glass-roofed shed full of gulls, and you step out into the wind, and there it is.

The Heldwater.

You see it all at once, the way people say you see the sea for the first time: not as water but as a direction. Everything north of here is lake. It fills the valley from wall to wall, eleven miles of it, {~flat and pewter-grey under a low sky, with the fells standing up out of it like shoulders|dark as slate and wrinkled by the wind, the fells on either side going down into it without a shore|a sheet of beaten lead, stippled with wind, the hills drowning in it on either side}. From up here, on the crest of the Stay, the water is so close you could step off the parapet into it. It laps at the stone a yard below your boots, calm as a bath, and on the other side of the road, four hundred feet below, is Scarrow.

That's the whole secret of the place, really. You're standing on the only thing between those two facts.

The crest road runs along the top of the wall, thirty feet wide and cobbled, with iron lamp-posts and braziers every fifty yards. Along its downstream side, built right onto the Stay, stands the College: tall, narrow buildings of the same pale stone, tied to one another by bridges and covered stairs. Their windows face the city. Chimneys, bells, a copper dome gone green. Everything leans slightly toward the lake, the way people lean into a wind.

Someone is waiting at the lift shed. They are wearing a beekeeper's veil, a canvas smock, and very old boots, and they are holding a smoker that's still going, so that they stand in their own small weather of blue smoke.

"Three," says the beekeeper, looking at each of you in turn. "Good. Great-aunt Hester says you're all right. She felt the car stop. She asked me to come up and count you." They lift the veil. Underneath is a calm, bony face, a shaven head, grey eyes that look at you with complete attention and no embarrassment at all. "Sal Quaile. They, if you're Asking."
*set met_sal true

Tolly, still dripping, says, "Your great-aunt [i]felt[/i] us? Who on earth is your great-aunt?"

"Hester Quaile," says Sal. And, when that gets nothing from Tolly but a polite blank: "The Keystone."

Even Tolly has heard of the Keystone.

*page_break The Oathing Hall

The Weighing takes place in the Oathing Hall, which is at the heart of the crest where the College buildings crowd together under the green dome.

It is a round room, cold as a church, and it smells of wet stone. The floor is inlaid with lines of brass that run from the walls to the center like the spokes of a wheel, and at the center, where they meet, is a round iron grille about as wide as a cartwheel. Air comes up through the grille, steady and chill, carrying the hum with it. This, a second-year whispers to the line of new students, is [i]the Throat.[/i] It goes all the way down into the heart of the Stay. When you swear a vow here, you swear it down there.

There are twenty-nine of you, first-years in travelling clothes, shuffling on the brass. Above the door, carved deep enough to lay a finger in, is the College's motto: WHAT IS KEPT, KEEPS.

The Warden stands beside the Throat.

Agnes Brathwaite is tall, and grey, and holds herself like a tool that has been well made for a single purpose and has had that purpose for a long time. She has a plain black gown, a plain grey face, and eyes that don't move around the room so much as take it apart. She does not introduce herself. Everyone knows who she is.

"You will each come forward," she says, "and I will ask you two questions. Answer them truthfully. I will know if you do not." She says this without emphasis, the way you'd tell a guest where the coats go. "I am sworn to the Plain Word, and I hear a lie the way a tuner hears a flat string. It is not a trick. It is not a test. It is only that I prefer to begin as I mean to go on."

She calls names. You watch.

Tolly goes up with his chin high and his coat still dripping. "Why have you come to the Stay, Scholar Varnish?"

"Because my mother told me to, Warden."

"Yes," says the Warden. You get the odd sense that she has heard something more than the words. "Are you sworn?"

A long pause. Tolly's hands are clenched at his sides. "My mother says I'm not to discuss it, Warden."

The Warden's face does not change at all. "Then we shan't," she says. "Thank you." Tolly walks back to the line looking as if he's been let off a hanging.

Then: "Scholar Mottram. Why have you come to the Stay?"

"To win," says Tamsin Mottram.

The whole line hears it land. The Warden only nods. "Are you sworn?"

"No."

A pause. You watch the Warden's head tilt, very slightly, exactly like a tuner hearing a flat string.

"Scholar Mottram," she says, "the Oathing Act requires the registration of vows sworn after one's eighteenth birthday. I ask about those."

Something happens in Tamsin's face: a door opening a crack and shutting again. "No vows since my birthday, Warden."

"Thank you," says the Warden. And that is all. Tamsin walks back to the line with her jaw like a rock. The Warden, you think, has just caught somebody in a lie, and handed them a truth to stand on instead.

"Scholar {surname}."

You walk out onto the brass. The air from the Throat is cold on your ankles. The hum is very loud here. It's not a sound anymore; it's a place.

"Why have you come to the Stay?"

*page_break Down to the Footings

There are four Watches at the College of the Stay, named for the parts of a dam: Crest, Sluice, Gallery and Footing. You are Footing Watch. So, you discover, are Tamsin Mottram, Tolly Varnish, and Sal Quaile, along with two quiet first-years from the mill towns who spend the first evening holding hands under the table.

Footing Watch lives at the bottom.

You get there by eight hundred and six steps, or by a groaning service lift the Watch calls the Bucket, down through the inside of the dam. The Footings are the long vaulted rooms in the toe of the Stay, where it meets the bedrock: the lowest and dampest rooms in the College, and the loudest. The walls sweat. The floor is warm, because the boiler pipes run under it. It is eleven degrees in summer and eleven degrees in winter, and the hum is so strong down here that there's a cup on the common-room mantel with a crack in it from the note.

"You get used to it," says the captain of Footing Watch, "and then you can't sleep anywhere else."
*set met_hob true

Hob Gorringe is a fourth-year, and he is enormous: six and a half feet of slow-moving ginger bulk with a beard like a hedge and a pencil behind each ear. He speaks so softly that everyone has to lean in, which you suspect is the point.

"Watch rules. There's one." He holds up a tuning fork, brass, as long as his hand. "Every morning and every night, somebody strikes the fork and holds it to the wall." He does it: a clear note, and the wall hums back in the same note, and for a moment the room seems to ring like a bell. "If the wall answers in B-flat, you go to bed. If it doesn't," and he nods at a brass bell on a bracket by the door, big as a bucket, "you ring that. Then you run upstairs and wake the Warden. Then you run back down here and do whatever she says. In that order."

He hands each of you a fork of your own. Yours is cold and heavier than it looks.

"The Footings take the load," Hob says. "Everything above us presses down on us. That's the job. Crest Watch gets the view, Sluice gets the machinery, Gallery gets the maps. We get the weight." He smiles for the first time, a big slow thing like a sunrise in a beard. "Best Watch there is. Supper's at seven."

Supper is in the Sump, the Footings' common room: a long scrubbed table, a stove, a piano with three dead keys, and a cauldron of something the second-years call "Stay stew" in a tone of voice that settles what's in it. The mill-town pair sit close. Hob reads an engineering journal. The rest of you have the evening to yourselves.

*page_break

Your cell is the size of a big cupboard: a cot, a shelf, a curtain for a door, and a slot in the wall that breathes cold air from somewhere deep in the dam. There's no window. There's nothing above you but four hundred feet of stone, and nothing on the other side of that stone but the lake.

You lie there and listen to the hum.

And then, somewhere around midnight, underneath the hum, someone begins to sing.

It is a woman's voice, low and unhurried, without words. It doesn't come from anywhere; it comes from the walls, the way the hum does, from the stone itself. But it moves. It rises and settles and holds a note for a long time, and when it holds the note, the hum holds with it, the way a tired horse steadies under a hand.

*chapter 2 What Is Kept
The College of the Stay teaches four things, the second-years tell you: how to promise, how to lean, how the dam works, and how it came to be. The first you'll do once. The rest take four years, and most people never finish the last one.

Practical Leaning is on Mondays, in a long attic room at the top of the crest buildings with a window the whole width of the lake. There is a tank of brown water on the windowsill with an eel in it. The eel is called Magistrate. It watches the class with an air of settled disapproval.

"A vow," says Master Fell, "is a lever."

He draws one on the board: a long plank, a little triangle for the fulcrum, a box at the short end marked THE WORLD. He looks tidier by daylight than he did in his dressing gown, which is to say extremely tidy. His chalk is sharpened. His cuffs are pinned. His handwriting is, as promised, terrible.

"The long arm is what it costs you. Give up something small and you have a short lever, and you'll move a teacup. Give up something that matters (really matters, to you, not to your mother or your minister) and you have a long one." He taps the box. "Purchase. It's an old sailor's word. A grip. The thing that lets a small man move a heavy rope. You'll get your purchase at the Oathing, those of you who want it, and after that the rest of your lives will be spent learning how not to waste it."

He sets a candle on the desk and leans on it. You can see him do it: a settling in the shoulders, a narrowing of the eyes.

Nothing happens. The candle does not light.

A few people laugh. Master Fell smiles at them as if they've done something clever. "Quite right. I have almost no purchase at all. I'm the only unsworn master in the College." He wipes his hands on a very clean handkerchief. "Which makes me uniquely qualified to tell you what it costs. Next question for the room, and you'll all answer it, and none of you will answer it honestly, and that's fine: what would you never give up?"

He goes along the rows. "My dignity," says a Crest Watch boy, to laughter. "Pudding," says someone else. Sal Quaile says, "The truth. I already did, though, so it's cheating." Tolly Varnish says, very brightly, "My mother," and gets the biggest laugh of the morning, and doesn't laugh himself.

Tamsin Mottram says, "Nothing's free," which isn't an answer, and Fell looks at her for a long moment and says, "No. It isn't." Then he looks at you.

*choice
  #"My family."
    *set tender %+10
    "Mm," says Fell. "That's the one they always come for." He moves on before you can ask who [i]they[/i] are.
  #"My freedom."
    *set duty %-10
    "Then you'll have the shortest lever in the room," says Fell, "and the lightest step." He sounds, of all things, envious.
  #"My own mind."
    *set bold %+5
    *set candor %+5
    "Good," says Fell. "Keep it. They'll ask for it in instalments."
  #"I'd rather not say."
    *set candor %-10
    Fell's face does something complicated and approving. "That," he says, "is the first honest thing anyone's said all morning."

Water and Stone is on Tuesdays, in a vaulted room full of brass gauges and plaster models of the Stay cut in half like a loaf. Dr. Odile Marchbank is small and square and grey, with ink on her fingers and reading glasses pushed up into hair that looks as if it lost a fight.
*set met_marchbank true

"The Stay," she says, before anyone has sat down, "is a hundred and ninety feet thick at the base. A masonry arch dam this tall, in this valley, should be four hundred." She lets that sit. "The difference is being made up by a woman in a room. Write that down. It will be on the examination."

She shows you seepage logs: twenty years of numbers from the weep-holes, written up every night by the Watches in pencil, and plotted on a long sheet of graph paper pinned to the wall. The line goes up. Not steeply. Steadily.

A Gallery Watch girl asks what that means. Dr. Marchbank takes off her glasses, cleans them, and puts them back on. "Ask me in a year," she says, and her mouth goes flat as a ruler.

History and Oath Law is on Wednesdays, in a book-lined room that smells of glue and dust, with Mr. Quentin Ebbing, the College archivist: a long, stooped, fussy man in a velvet waistcoat who says "Ah" before every sentence as if clearing it for traffic.
*set met_ebbing true

"Ah. Seventy-one years ago," says Mr. Ebbing, "Josiah Thwaite, Master-Sworn, raised the Stay across the Aske in a single season: the greatest act of leaning in the history of this or any nation." The valley beyond, he says, was "cleared, and its inhabitants resettled with compensation, and the Aske tamed at last." Scarrow no longer drowns every spring. The mills have water all year. "And for forty-one years, ah, the Stay has been held by the Keystone, Hester Quaile, a volunteer of singular courage." He moves on to the Oathing Act: no vows before eighteen, and no swearing on another's behalf. "Cradle-swearing," he says, with a little moue of distaste, "is a barbarism of the old families, now very properly illegal." Two seats down from you, Tolly Varnish goes the color of paper.

Tamsin Mottram puts her hand up. "What did they pay? Hebble. The compensation. How much?"

Mr. Ebbing blinks at her. For a moment something in his long face looks almost frightened. "Ah," he says. "The records are, ah, incomplete." And he turns the page.

By the end of the first week you know which of the three has got its hooks into you.

*choice
  #Master Fell's. You stay behind after Practical Leaning with a question.
    *set class_focus "fell"
    *set finesse +10
    *set rel_fell +10
    *set met_fell true
    Your question is about the candle: why it didn't light, if he'd leaned on it. Fell looks pleased in a hunted sort of way, as though nobody has asked him a follow-up question in years.

    "Because purchase is the muscle," he says, "and finesse is the hand. I've a very good hand and no muscle at all." He takes a stick of chalk and blows on it, and the dust hangs in the air in a perfect little cube, turning slowly, before it falls. "Most of the College will teach you to lift heavier things. I'll teach you to lift them precisely. It matters more than they think." He looks at the cube of dust as it falls apart. "It matters most when there isn't enough."

    "The Old Sluices," she says. "Four tunnels through the base, on the east side, with iron gates the size of a house. Thwaite built them so the lake could be let down if it ever needed to be. Sealed in the year of the Mill Compact, when the mill-owners decided they'd rather have the water where they could count it." She taps the gates with a pencil. "Open those, and you could draw the Heldwater down forty feet in a week. If anyone had the nerve. And the key." She rolls the drawing up again. "Nobody has either."

    "Ah," he says at last. "It meant, ah, incomplete." Then he does something unexpected. He takes a pasteboard card from a drawer, signs it with a fountain pen, blots it, and hands it to you. It says ARCHIVE: READER, and your name, and the date.

    "Nobody has asked me a question after class since the Act," he says. "The College archive is in the Third Gallery, behind the green door. Most of what you want isn't there." A pause. "Some of it is." He looks, briefly, like a man who has just done something brave and would like very much to sit down.
    *journal Mr. Ebbing gave you a reader's pass to the College archive, behind the green door in the Third Gallery.
*page_break Night Watch

In the third week, Footing Watch starts night patrols.

Every night two scholars walk the Second and Third Galleries from ten until one with a lantern, a pencil, a logbook and a tuning fork. At each weep-hole you hold the lantern close, count the drips for a minute, and write down the number. At each junction you strike the fork and put it to the wall. The galleries are narrow and wet and go on for miles inside the dam, and the lantern light doesn't reach very far.

"Pick your partner," says Hob Gorringe, with his pencil poised over the roster. "First patrol, you get a choice. After that, you get what I give you."

*label patrol_tamsin
Tamsin arrives eleven minutes late, from her laundry shift, with a wicker basket of folded sheets on her hip that she has to drop at the Sluice laundry on the way. She doesn't apologize. She says, "Sheets first, then the walls," and sets off without checking whether you're following.

The basket is heavy. You can tell from the way she carries it: on her hip, then on her other hip, then both arms. Her knuckles are red and cracked from the mangle. On the fourth flight of stairs you put a hand out to take one handle.

Her whole body jerks as if you've burned her.

She doesn't let go. She [i]can't[/i] let go. You see it happen: her fingers lock on the wicker, the tendons standing out in her wrist, and her face goes grey and tight with something that isn't anger. It looks like pain. You let go of the basket, fast, and she sags against the wall, breathing hard.

"Don't," she says. "Don't do that. Don't ever just—give me things."

*choice

  #Say nothing. Wait.
    *set bold %-5
    She hitches the basket up, and climbs another three stairs, and stops. "You're going to find out anyway," she says, without turning round.

"Hedge-sworn," she says. "When I was fourteen. In the Rows, in the ruins of the old Hebble Wordhouse, where the Rows folk used to meet." She starts climbing again, slowly, talking to the stairs. "Midwinter. The Council sent a man round with charity baskets. Ham, tea, oranges. A card with the Committee's crest on it. My mam took one, because there wasn't anything else in the house, and then she sat at the table with it and cried. Not because she was grateful." Tamsin's voice doesn't change at all. "So I went down to the Wordhouse that night and I said, [i]I will take nothing I have not earned.[/i] And it took."

The laundry door is at the top of the stairs. She shoulders it open and dumps the basket on a table, and flexes her hands.

"So that's it. I can't take charity. I can't take gifts. Can't take a hand up the stairs, if it's a favor. Can't take a compliment unless I think I've earned it, and I never think I've earned it." She shrugs. "I can trade. I can work. I can be paid. Anything else, my hands won't close on it."

It's illegal. You both know it's illegal. She's just told you anyway.

*label patrol_tolly
Tolly turns up to patrol in a quilted smoking jacket, carrying the lantern, the logbook, the tuning fork and a hip flask, and informs you that the flask is "for emergencies, and for the dark, which is an emergency."

He is a surprisingly good patrol partner. He counts drips in a whisper, like a man at a séance, and writes the numbers in a beautiful copperplate hand, and at every junction he strikes the fork and holds it to the stone and closes his eyes to listen. "B-flat," he reports each time, with enormous satisfaction, "B-flat, B-flat, still B-flat. God bless B-flat."

At the Second Gallery post room there's a pigeonhole for Footing Watch's night post. There's a letter in it for him. The envelope is thick and cream, and the hand on it is strong and slanting.

Tolly looks at it for a moment before he picks it up. Then he opens it, standing in the lantern light, and reads it, and you watch his hands.

[i]Darling. The Board will open the Crown to first-years this year. It will be announced at the Michaelmas Feast. You will enter your name when it is announced. Write Sunday. Mother.[/i]

He reads it out loud. You didn't ask him to. His voice is perfectly light, and his left hand has closed into a fist so tight the letter is crumpling in the right one.

"Well," he says. "There we are. I'll be entering the Crown." He folds the letter very small. "I'm told it's a great honor."

"I was told never to discuss it," he says. "So I'm not going to discuss it. I'm going to [i]describe[/i] it. That's different. I've had eighteen years to find the gaps."

He sits down on the step with the lantern between his feet.

"When I was one, I had scarlet fever. Nearly died. My mother sat up with me for eleven nights. And on the eleventh night, she stood over my cot and she swore a vow for me. In my name." His voice goes very flat and precise, the way people's voices do when they've told a story to themselves a great many times. "[i]I will not disobey my mother.[/i]" He shrugs. "I suppose she thought a child who does as he's told doesn't touch the stove. Doesn't run into the road. Doesn't die." He looks at the crumpled letter. "I didn't die. So there's that."

You think about the pâté. [i]Eat the pâté first.[/i] His hand moving before he'd finished reading.

"It's not like being hypnotized," Tolly says. "People think it would be like being hypnotized. It's not. I'm all here. I want things. I want lots of things. It's just that when she says, my body has already started before I've finished wanting anything else." He smiles at you, a wobbly, brilliant, terrible smile. "Anyway. It's illegal. It would ruin her. So, you know." He puts a finger to his lips. "Not discussed."

*label patrol_sal
Sal's patrol route, it turns out, goes up rather than down: up out of the galleries, up an iron ladder, through a hatch, and out onto the upstream face of the east abutment, where the Stay meets the fell and the heather comes right down to the waterline. Twelve white hives stand in two rows on a ledge above the lake, like a small village.

"They count as part of the Stay," Sal says, when you point out that this isn't a gallery. "The Warden said so. I asked her very precisely."

It's a clear night. The lake is black and absolutely still, with every star in it. The bees are asleep, a low comfortable murmur inside the boxes, like a room full of people breathing. Sal sits down cross-legged in the heather and puts the lantern out.

"You can ask me anything," they say. "I'll tell you the truth. It's a good place for it."

You sit a while longer in the heather, listening to the bees breathe. Then Sal relights the lantern and says, "Walls," and you climb back down through the hatch into the Third Gallery to log the weep-holes, because that's the job.
*goto fray

*label fray
*page_break

It's on the way back, deep in the Third Gallery, that you see it.

At first you think it's frost. A thin white line in the mortar between two blocks at shoulder height, fine as a hair, catching the lantern light. But the galleries never get cold enough for frost. You hold the lantern closer.

It's salt. Or it looks like salt: a white crystalline thread, a few inches long, lying in the joint. And it's moving.

Not much. You have to stare to be sure. But the thread is [i]pulsing,[/i] very slowly, like something being drawn through the eye of a needle: a tiny tug, then a pause, then a tug. With each tug the mortar around it crumbles a hair's breadth, and a grain of grit falls to the floor.

*if (patrol_with = "tamsin")
  Tamsin has gone very still beside you. She doesn't say anything. She's looking at the thread, and her hand has gone to the key at her throat, and she's holding it so hard her knuckles are white.

  "Seen anything like that before?" you ask.

  "No," says Tamsin. A pause, too long. "Leave it. It's nothing."
*elseif (patrol_with = "tolly")
  "Is it," says Tolly, very quietly, "supposed to do that?"

  "I shouldn't think so."

  "No. No, I shouldn't think so either." He takes a nip from the emergency flask. "I'm going to write down that I saw it, and then I'm going to have a lie down for about a week."
